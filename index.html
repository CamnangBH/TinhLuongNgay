/* =====================================================================
 * LỚP 1 – XỬ LÝ DỮ LIỆU EXCEL (PayrollParser)
 * LỚP 2 – DỮ LIỆU MINH HỌA (DemoData) – tách biệt hoàn toàn dữ liệu thật
 * LỚP 3 – TÍNH TOÁN & TỔNG HỢP (Calc)
 * LỚP 4 – MÁY CHỦ GIẢ LẬP: xác thực, phân quyền, truy vấn (MockServer)
 * LỚP 5 – API (điểm thay thế bằng backend REST thật)
 * ===================================================================== */

/* Danh mục mảng dịch vụ */
const DOMAINS = {
  A: { name: 'Băng rộng cố định (BRCĐ)', short: 'BRCĐ', color: '#0B5CAD' },
  B: { name: 'TSL, Internet trực tiếp, kênh thuê riêng', short: 'TSL/KTR', color: '#1AA6DE' },
  C: { name: 'VNP trả trước + trả sau', short: 'VNP', color: '#6A55C8' },
  D: { name: 'CNTT', short: 'CNTT', color: '#12A08A' },
  E: { name: 'Các khoản tiền khác', short: 'Khác', color: '#C98A1E' },
  U: { name: 'Chưa phân loại', short: 'Chưa PL', color: '#8C99A6' },
};
const DOMAIN_ORDER = ['A', 'B', 'C', 'D', 'E', 'U'];

/* ---------------------------------------------------------------------
 * LỚP 1 – PayrollParser: đọc 3 sheet, chuẩn hóa, kiểm tra chất lượng
 * ------------------------------------------------------------------- */
const PayrollParser = {
  txt(cell) { return !cell ? '' : (cell.t === 's' ? String(cell.v).replace(/\s+/g, ' ').trim() : cell.text); },
  findSheet(wb, keys) { return wb.sheetNames.find(n => keys.includes(U.norm(n))); },
  domainOf(groupName) {
    const g = U.norm(groupName);
    if (/BRCD|BANG RONG/.test(g)) return 'A';
    if (/TSL|KENH THUE|INTERNET TRUC TIEP/.test(g)) return 'B';
    if (/VNP|VINAPHONE/.test(g)) return 'C';
    if (/CNTT/.test(g)) return 'D';
    if (/^LUONG/.test(g)) return 'E';
    return 'U';
  },
  isKK(label) { const s = U.norm(label); return /(^|[^A-Z])KK([^A-Z]|$)/.test(s) || s.includes('KHUYEN KHICH'); },
  isAdj(label) { const s = U.norm(label); return s.includes('DIEU CHINH') || s.includes('BO SUNG'); },

  /** Gợi ý kỳ lương nếu file có ghi "Tháng mm/yyyy" ở phần đầu sheet – chỉ là gợi ý, người dùng xác nhận */
  detectPeriod(wb) {
    // Ưu tiên sheet “Tổng hợp”, sau đó mới tới các sheet khác
    const order = [...wb.sheetNames].sort((a, b) => (U.norm(b) === 'TONG HOP') - (U.norm(a) === 'TONG HOP'));
    for (const n of order) {
      const sh = wb.sheet(n);
      for (let r = 1; r <= Math.min(sh.maxR, 12); r++) for (let c = 1; c <= Math.min(sh.maxC, 20); c++) {
        const m = U.norm(this.txt(sh.get(r, c))).match(/(?:THANG|KY LUONG|KY)\s*(\d{1,2})\s*[\/\-.]\s*(?:NAM\s*)?(\d{4})/);
        if (m) return { code: `${m[2]}-${m[1].padStart(2, '0')}`, evidence: `Sheet “${n}”, ô ${U.numToCol(c)}${r}: “${this.txt(sh.get(r, c))}”` };
      }
    }
    return null;
  },

  parse(wb, meta) {
    const issues = [];
    const add = (level, code, msg, extra = {}) => issues.push({ level, code, msg, ...extra });
    const ds = {
      id: 'p' + U.uid(6), period: meta.period, source: meta.source, fileName: meta.fileName, loadedAt: Date.now(),
      sheetNames: wb.sheetNames, issues, errorRows: [], duplicates: [], skippedBlank: 0,
      employees: [], totalRow: null, details: [], moneyTypes: [], idMap: {}, idMapSource: null,
      formula: { included: {}, confirmed: null, undetermined: [] },
    };
    /* ---- Sheet Tổng hợp ---- */
    const thName = this.findSheet(wb, ['TONG HOP']);
    if (!thName) throw new Error(`Không tìm thấy sheet “Tổng hợp”. Các sheet có trong file: ${wb.sheetNames.join(', ')}.`);
    const sh = wb.sheet(thName);
    ds.sheets = { tongHop: thName };
    for (let r = 1; r <= 7 && !ds.sample; r++) for (let c = 1; c <= 3; c++) {
      const t = U.norm(this.txt(sh.get(r, c)));
      if (t.includes('DU LIEU MAU') || t.includes('GIA LAP')) { ds.sample = true; add('warn', 'SAMPLE', 'File được ghi là DỮ LIỆU MẪU – số tiền giả lập, không phải số liệu lương thật.'); break; }
    }
    let h1 = 0;
    for (let r = 1; r <= Math.min(40, sh.maxR) && !h1; r++)
      for (let c = 1; c <= sh.maxC; c++) if (U.norm(this.txt(sh.get(r, c))) === 'MA NHAN VIEN') { h1 = r; break; }
    if (!h1) throw new Error('Sheet “Tổng hợp” không có hàng tiêu đề chứa cột “Mã nhân viên”. Kiểm tra lại cấu trúc file.');
    const infoKeys = { stt: ['STT'], code: ['MA NHAN VIEN'], name: ['HO TEN', 'HO VA TEN'], unit: ['DON VI'], title: ['TEN VI TRI', 'CHUC DANH', 'VI TRI'], payGroup: ['NHOM LUONG'] };
    const info = {};
    for (let c = 1; c <= sh.maxC; c++) {
      const t = U.norm(this.txt(sh.get(h1, c)));
      for (const k in infoKeys) if (!info[k] && infoKeys[k].includes(t)) info[k] = c;
    }
    for (const k of ['code', 'name', 'unit', 'title']) if (!info[k]) throw new Error(`Sheet “Tổng hợp” thiếu cột bắt buộc: ${{ code: 'Mã nhân viên', name: 'Họ tên', unit: 'Đơn vị', title: 'Tên vị trí/Chức danh' }[k]}.`);
    if (!info.payGroup) add('warn', 'NO_PAYGROUP', 'Không tìm thấy cột “Nhóm lương” – bộ lọc nhóm lương sẽ trống.');
    const firstMoney = Math.max(...Object.values(info)) + 1;
    // Hàng tiêu đề phụ (cấp 2)
    let h2 = 0;
    for (let c = firstMoney; c <= sh.maxC; c++) { const cell = sh.get(h1 + 1, c); if (cell && cell.t === 's') { h2 = h1 + 1; break; } }
    ds.headerRow = h1; ds.subHeaderRow = h2; ds.infoCols = info;
    // Xác định cột tiền & nhóm
    const columns = [];
    let grp = null;
    for (let c = firstMoney; c <= sh.maxC; c++) {
      const t1 = this.txt(sh.get(h1, c)), t2 = h2 ? this.txt(sh.get(h2, c)) : '';
      const letter = U.numToCol(c);
      if (!t1 && !t2) {
        let hasData = false;
        for (let r = (h2 || h1) + 1; r <= sh.maxR; r++) if (sh.get(r, c)) { hasData = true; break; }
        if (hasData) add('warn', 'COL_NO_HEADER', `Cột ${letter} có dữ liệu nhưng không có tiêu đề – không được đưa vào phân tích.`);
        grp = null; continue;
      }
      let col;
      if (t1 && !t2) { grp = null; col = { group: t1, sub: t1, standalone: true, groupKey: 's' + letter }; }
      else {
        if (t1) grp = { name: t1, start: letter };
        if (!grp) grp = { name: '(Không có tiêu đề nhóm)', start: letter };
        col = { group: grp.name, sub: t2, standalone: false, groupKey: 'g' + grp.start };
      }
      const domain = this.domainOf(col.group);
      Object.assign(col, {
        key: letter, letter, idx: c, domain,
        isTotal: !col.standalone && /^TONG/.test(U.norm(col.sub)),
        isKK: this.isKK(col.sub), isAdj: this.isAdj(col.sub),
      });
      col.label = col.standalone ? col.group : (['A', 'B', 'C', 'D'].includes(domain) ? `${DOMAINS[domain].short} – ${col.sub}` : (domain === 'E' ? col.sub : `${col.group} – ${col.sub}`));
      if (domain === 'U') add('warn', 'UNCLASSIFIED', `Cột ${letter} “${col.label}” chưa xác định được mảng dịch vụ → xếp vào nhóm “Chưa phân loại”.`);
      columns.push(col);
    }
    if (!columns.length) throw new Error('Không xác định được cột tiền nào trong sheet “Tổng hợp”.');
    ds.columns = columns;
    // Nhóm cột
    const groups = {};
    for (const c of columns) {
      const g = groups[c.groupKey] || (groups[c.groupKey] = { key: c.groupKey, name: c.group, domain: c.domain, cols: [], totalCol: null });
      if (c.isTotal) g.totalCol = c.key; else g.cols.push(c.key);
    }
    ds.groups = Object.values(groups);
    /* ---- Dòng dữ liệu ---- */
    const seen = new Map(); let numericCodes = 0;
    for (let r = (h2 || h1) + 1; r <= sh.maxR; r++) {
      const code = this.txt(sh.get(r, info.code)).trim();
      const name = this.txt(sh.get(r, info.name)), unit = this.txt(sh.get(r, info.unit)), title = this.txt(sh.get(r, info.title));
      const stt = info.stt ? this.txt(sh.get(r, info.stt)) : '';
      const pgCell = info.payGroup ? sh.get(r, info.payGroup) : null;
      // Ô tiền “có dữ liệu” = số khác 0 hoặc giá trị không phải số (dòng chỉ có công thức trả 0 được coi là trống)
      const hasMoney = columns.some(c => { const x = sh.get(r, c.idx); return x && (x.t !== 'n' || x.v !== 0); });
      if (!code && !name && !unit && !title && !stt && !hasMoney && !pgCell) { ds.skippedBlank++; continue; }
      const label = U.norm([stt, name, unit, title].join(' '));
      if (!code) {
        // Dòng tổng: có một ô thông tin ĐÚNG BẰNG “Tổng”/“Tổng cộng”/“Cộng” (không nhầm với họ “Tống”, “Tông”…)
        const isTotalCell = x => { const raw = String(x || '').trim().toLowerCase(); return ['tổng', 'tổng cộng', 'cộng', 'tổng số'].includes(raw) || /^tổng cộng\b/.test(raw); };
        if ([stt, name, unit, title].some(isTotalCell)) {
          const values = {}; columns.forEach(c => { const x = sh.get(r, c.idx); values[c.key] = x && x.t === 'n' ? x.v : null; });
          if (!ds.totalRow) ds.totalRow = { row: r, values };
          else add('warn', 'MULTI_TOTAL', `Có thêm dòng tổng ở dòng ${r} – đã loại khỏi danh sách nhân sự.`);
        } else ds.errorRows.push({ sheet: thName, row: r, reason: 'Thiếu “Mã nhân viên” nhưng có dữ liệu – không đưa vào phân tích.' });
        continue;
      }
      if (['tổng', 'tổng cộng', 'cộng'].includes(name.trim().toLowerCase())) { ds.errorRows.push({ sheet: thName, row: r, reason: 'Dòng có Họ tên là “Tổng/Cộng” – loại khỏi danh sách nhân sự.' }); continue; }
      if (sh.get(r, info.code).t === 'n') numericCodes++;
      const values = {}, blanks = [], bad = [];
      for (const c of columns) {
        const x = sh.get(r, c.idx);
        if (!x) { values[c.key] = 0; blanks.push(c.key); }
        else if (x.t === 'n') values[c.key] = x.v;
        else { values[c.key] = 0; bad.push(c.key); ds.errorRows.push({ sheet: thName, row: r, hrm: code, reason: `Ô ${c.letter}${r} không phải số (“${x.text}”) – tạm tính bằng 0, cần kiểm tra.` }); }
      }
      if (seen.has(code)) {
        ds.duplicates.push({ hrm: code, row: r, firstRow: seen.get(code) });
        ds.errorRows.push({ sheet: thName, row: r, hrm: code, reason: `Trùng mã nhân viên với dòng ${seen.get(code)} – bản ghi trùng bị loại.` });
        continue;
      }
      seen.set(code, r);
      const pg = pgCell ? this.txt(pgCell) : '';
      ds.employees.push({
        hrm: code, name, unit: unit || '(Chưa có đơn vị)', title: title || '(Chưa có chức danh)', payGroup: pg === '' ? '(Trống)' : pg,
        stt, row: r, values, blanks, bad,
        complete: !!(name && unit && title && pg !== '') && bad.length === 0,
      });
    }
    if (!ds.employees.length) throw new Error('Không có dòng nhân viên hợp lệ nào trong sheet “Tổng hợp”.');
    if (numericCodes) add('warn', 'NUMERIC_CODE', `${numericCodes} mã nhân viên được lưu dạng số trong Excel – nếu mã gốc có số 0 ở đầu, số 0 có thể đã mất từ file nguồn.`);
    /* ---- Kiểm tra công thức cột Tổng của từng nhóm (suy ra từ dữ liệu) ---- */
    for (const g of ds.groups) {
      g.cols.forEach(k => ds.formula.included[k] = true);
      if (!g.totalCol) { g.check = { status: 'nototal' }; continue; }
      const n = g.cols.length, full = (1 << n) - 1, emps = ds.employees;
      const ok = mask => emps.every(e => {
        let s = 0; for (let i = 0; i < n; i++) if (mask & (1 << i)) s += e.values[g.cols[i]];
        return Math.abs(s - e.values[g.totalCol]) < 1;
      });
      const pop = m => { let k = 0; while (m) { k += m & 1; m >>= 1; } return k; };
      const badFull = emps.filter(e => Math.abs(U.sum(g.cols, k => e.values[k]) - e.values[g.totalCol]) >= 1).length;
      let best = 0, alt = 0;
      if (ok(full)) best = full;
      else if (n <= 14) {
        let bc = -1;
        for (let m = full - 1; m > 0; m--) {
          if (pop(m) < bc) continue;
          if (ok(m)) { if (pop(m) > bc) { bc = pop(m); best = m; alt = 0; } else alt++; }
        }
      }
      const excluded = g.cols.filter((_, i) => best && !(best & (1 << i)));
      if (best === full) g.check = { status: 'full', badRows: 0 };
      else if (best && !alt) {
        g.check = { status: 'subset', excluded, badRows: badFull };
        excluded.forEach(k => ds.formula.included[k] = false);
        add('warn', 'GROUP_SUBSET', `Nhóm “${g.name}”: cột ${g.totalCol} (“${ds.columns.find(c => c.key === g.totalCol).sub}”) KHÔNG bằng tổng tất cả cột thành phần (lệch ở ${badFull}/${emps.length} dòng), nhưng khớp ${emps.length}/${emps.length} dòng khi bỏ các cột: ${excluded.map(k => k + ' “' + ds.columns.find(c => c.key === k).sub + '”').join('; ')}. Các cột này được tạm để NGOÀI tổng thu nhập – cần xác nhận nghiệp vụ.`);
      } else {
        g.check = { status: best ? 'ambiguous' : 'none', badRows: badFull };
        ds.formula.undetermined.push(g.key);
        add('error', 'GROUP_UNKNOWN', `Nhóm “${g.name}”: Chưa xác định công thức đối soát – cột tổng ${g.totalCol} không khớp tổng các cột thành phần (${badFull} dòng lệch) và không tìm được tổ hợp cột duy nhất khớp mọi dòng. Tạm tính tất cả cột thành phần; cần quản trị xác nhận.`);
      }
    }
    /* ---- Dòng “Tổng” trong file so với tổng các dòng nhân viên ---- */
    if (ds.totalRow) {
      const diffs = columns.map(c => {
        const fileV = ds.totalRow.values[c.key], sumV = U.sum(ds.employees, e => e.values[c.key]);
        return { key: c.key, fileV, sumV, diff: fileV == null ? null : fileV - sumV };
      });
      ds.totalRow.diffs = diffs;
      const mism = diffs.filter(d => d.diff != null && Math.abs(d.diff) >= 1).length;
      const empty = diffs.filter(d => d.fileV == null).length;
      if (mism) add('warn', 'TOTAL_ROW_MISMATCH', `Dòng “Tổng” (dòng ${ds.totalRow.row}) KHÔNG khớp tổng các dòng nhân viên ở ${mism}/${columns.length} cột${empty ? `; ${empty} cột trống ở dòng Tổng` : ''}. Dòng Tổng có thể là tổng của danh sách gốc đầy đủ (file hiện tại có thể chỉ là phần trích). Dashboard không dùng dòng Tổng để tính toán.`);
      else add('info', 'TOTAL_ROW_OK', `Dòng “Tổng” (dòng ${ds.totalRow.row}) khớp tổng các dòng nhân viên ở tất cả cột.`);
    } else add('info', 'NO_TOTAL_ROW', 'Không có dòng “Tổng” trong sheet Tổng hợp.');
    // Ô trống (coi = 0)
    const blankCols = columns.filter(c => ds.employees.every(e => e.blanks.includes(c.key)));
    if (blankCols.length) add('info', 'BLANK_COLS', `Các cột trống ở toàn bộ dòng nhân viên (coi = 0): ${blankCols.map(c => c.key + ' “' + c.label + '”').join('; ')}.`);
    const pgZero = ds.employees.filter(e => e.payGroup === '0').length;
    if (pgZero) add('info', 'PAYGROUP_ZERO', `${pgZero} nhân sự có “Nhóm lương” = 0 trong file – giữ nguyên giá trị “0”, không tự diễn giải.`);
    const negCells = U.sum(ds.employees, e => columns.filter(c => e.values[c.key] < 0).length);
    if (negCells) add('info', 'NEGATIVE', `${negCells} ô có giá trị âm (khoản giảm trừ/điều chỉnh) – được giữ nguyên.`);
    const sttNums = ds.employees.map(e => +e.stt).filter(x => isFinite(x) && x > 0);
    if (sttNums.length > 1) {
      const gaps = sttNums.filter((x, i) => i && x !== sttNums[i - 1] + 1).length;
      if (gaps) add('info', 'STT_GAP', `Cột STT không liên tục (${gaps} chỗ ngắt, từ ${Math.min(...sttNums)} đến ${Math.max(...sttNums)}) – file có thể là phần trích từ danh sách lớn hơn.`);
    }
    /* ---- Sheet Loại tiền ---- */
    const ltName = this.findSheet(wb, ['LOAI TIEN']);
    if (!ltName) add('warn', 'NO_MONEYTYPE', 'Không có sheet “Loại tiền” – loại tiền ở sheet Chi tiết sẽ không ánh xạ được tên.');
    else {
      ds.sheets.loaiTien = ltName;
      const s = wb.sheet(ltName); let hr = 0, cId = 0, cName = 0;
      for (let r = 1; r <= Math.min(30, s.maxR) && !hr; r++) for (let c = 1; c <= s.maxC; c++) {
        const t = U.norm(this.txt(s.get(r, c)));
        if (t === 'ID LOAI TIEN') { hr = r; cId = c; }
        if (t === 'LOAI TIEN') cName = c;
      }
      if (!hr) add('warn', 'MONEYTYPE_HEADER', 'Sheet “Loại tiền” không có tiêu đề “ID loại tiền”.');
      else for (let r = hr + 1; r <= s.maxR; r++) {
        const id = this.txt(s.get(r, cId)), name = cName ? this.txt(s.get(r, cName)) : '';
        if (!id && !name) continue;
        if (!id) { ds.errorRows.push({ sheet: ltName, row: r, reason: 'Loại tiền thiếu ID.' }); continue; }
        if (ds.moneyTypes.some(m => m.id === id)) { add('warn', 'MONEYTYPE_DUP', `ID loại tiền “${id}” bị trùng (dòng ${r}).`); continue; }
        ds.moneyTypes.push({ id, name: name || '(Không tên)' });
      }
    }
    /* ---- Sheet Chi tiết ---- */
    const ctName = this.findSheet(wb, ['CHI TIET']);
    if (!ctName) add('warn', 'NO_DETAIL', 'Không có sheet “Chi tiết” – không có dữ liệu mã thuê bao.');
    else {
      ds.sheets.chiTiet = ctName;
      const s = wb.sheet(ctName); let hr = 0; const cols = {};
      const want = { hrm: ['MA HRM', 'MA NHAN VIEN'], sub: ['MA TB', 'MA THUE BAO'], idTH: ['ID TONG HOP'], amount: ['TIEN', 'SO TIEN'], typeId: ['ID LOAI TIEN'] };
      for (let r = 1; r <= Math.min(30, s.maxR) && !hr; r++) for (let c = 1; c <= s.maxC; c++) if (U.norm(this.txt(s.get(r, c))) === 'MA HRM') { hr = r; break; }
      if (!hr) add('error', 'DETAIL_HEADER', 'Sheet “Chi tiết” không có tiêu đề “Mã HRM”.');
      else {
        for (let c = 1; c <= s.maxC; c++) { const t = U.norm(this.txt(s.get(hr, c))); for (const k in want) if (!cols[k] && want[k].includes(t)) cols[k] = c; }
        const miss = Object.keys(want).filter(k => !cols[k]);
        if (miss.length) add('error', 'DETAIL_COLS', `Sheet “Chi tiết” thiếu cột: ${miss.join(', ')}.`);
        ds.detailHeaderRow = hr;
        const empSet = new Set(ds.employees.map(e => e.hrm)), typeSet = new Set(ds.moneyTypes.map(m => m.id));
        for (let r = hr + 1; r <= s.maxR; r++) {
          const g = k => cols[k] ? s.get(r, cols[k]) : null;
          if (['hrm', 'sub', 'idTH', 'amount', 'typeId'].every(k => !g(k))) continue;
          const d = { row: r, hrm: this.txt(g('hrm')).trim(), sub: this.txt(g('sub')), idTH: this.txt(g('idTH')), amount: null, typeId: this.txt(g('typeId')) };
          const a = g('amount');
          if (a && a.t === 'n') d.amount = a.v;
          else { ds.errorRows.push({ sheet: ctName, row: r, hrm: d.hrm, reason: `Số tiền không hợp lệ (“${a ? a.text : 'trống'}”) – dòng bị loại.` }); continue; }
          if (!d.hrm) { ds.errorRows.push({ sheet: ctName, row: r, reason: 'Thiếu Mã HRM – dòng bị loại.' }); continue; }
          d.matched = empSet.has(d.hrm);
          d.typeOk = typeSet.has(d.typeId);
          ds.details.push(d);
        }
        if (!ds.details.length) add('warn', 'DETAIL_EMPTY', `Sheet “${ctName}” chỉ có hàng tiêu đề (dòng ${hr}), KHÔNG có dòng dữ liệu nào → không có mã thuê bao để truy vết; mọi đối soát Tổng hợp ↔ Chi tiết ở trạng thái “Chưa đủ căn cứ”.`);
        const unm = ds.details.filter(d => !d.matched);
        if (unm.length) add('error', 'DETAIL_HRM', `${unm.length} dòng Chi tiết có Mã HRM không có trong sheet Tổng hợp: ${U.uniq(unm.map(d => d.hrm)).slice(0, 15).join(', ')}${unm.length > 15 ? '…' : ''}.`);
        const unt = ds.details.filter(d => !d.typeOk);
        if (unt.length) add('error', 'DETAIL_TYPE', `${unt.length} dòng Chi tiết có “ID loại tiền” chưa có trong danh mục Loại tiền: ${U.uniq(unt.map(d => d.typeId || '(trống)')).join(', ')}.`);
        const ids = U.uniq(ds.details.map(d => d.idTH));
        /* Sheet tùy chọn “ID tổng hợp”: khai báo tường minh ID tổng hợp → cột hạng mục */
        const idName = this.findSheet(wb, ['ID TONG HOP', 'DANH MUC ID TONG HOP']);
        if (idName) {
          ds.sheets.idTongHop = idName;
          const s2 = wb.sheet(idName); let hr2 = 0, cI = 0, cC = 0;
          for (let r = 1; r <= Math.min(30, s2.maxR) && !hr2; r++) for (let c = 1; c <= s2.maxC; c++) {
            const t = U.norm(this.txt(s2.get(r, c)));
            if (t === 'ID TONG HOP') { hr2 = r; cI = c; }
            if (['COT TONG HOP', 'COT', 'COT HANG MUC'].includes(t)) cC = c;
          }
          if (!hr2 || !cC) add('warn', 'IDTH_SHEET', `Sheet “${idName}” thiếu tiêu đề “ID tổng hợp” / “Cột Tổng hợp” – không dùng được để ánh xạ.`);
          else {
            const leafKeys = new Set(columns.filter(c => !c.isTotal).map(c => c.key)), bad = [];
            for (let r = hr2 + 1; r <= s2.maxR; r++) {
              const id = this.txt(s2.get(r, cI)), col = this.txt(s2.get(r, cC)).toUpperCase().trim();
              if (!id) continue;
              if (!leafKeys.has(col)) { bad.push(`${id}→${col || '(trống)'}`); continue; }
              if (ds.idMap[id] && ds.idMap[id] !== col) { add('error', 'IDTH_DUP', `ID tổng hợp “${id}” khai báo 2 cột khác nhau (${ds.idMap[id]}, ${col}) – giữ cột đầu.`); continue; }
              ds.idMap[id] = col;
            }
            ds.idMapSource = 'file';
            if (bad.length) add('error', 'IDTH_BADCOL', `Sheet “${idName}”: ${bad.length} dòng trỏ tới cột không phải hạng mục tiền: ${bad.slice(0, 10).join(', ')}.`);
            add('info', 'IDTH_FILE', `Đã đọc ${Object.keys(ds.idMap).length} ánh xạ ID tổng hợp → cột từ sheet “${idName}” (quản trị có thể xem lại ở trang Cấu hình công thức).`);
          }
        }
        const unmappedIds = ids.filter(i => !ds.idMap[i]);
        if (idName && unmappedIds.length) add('error', 'IDTH_UNMAPPED', `${unmappedIds.length} giá trị ID tổng hợp ở sheet Chi tiết chưa có trong sheet “${idName}”: ${unmappedIds.slice(0, 10).join(', ')} → đối soát theo hạng mục ở trạng thái “Chưa xác định”.`);
        if (ids.length && !idName) add('warn', 'IDTH_MAP', `Sheet Chi tiết có ${ids.length} giá trị “ID tổng hợp” khác nhau. File KHÔNG có bảng định nghĩa ID tổng hợp ↔ cột hạng mục của sheet Tổng hợp → cần quản trị khai báo ánh xạ (trang “Cấu hình công thức”); dashboard không tự ghép theo phỏng đoán.`);
      }
    }
    return ds;
  },
};

/* ---------------------------------------------------------------------
 * LỚP 2 – DemoData: DỮ LIỆU MINH HỌA (tên, mã, số tiền đều là giả lập)
 * Chỉ dùng để trình diễn giao diện; không trộn với dữ liệu Excel thật.
 * ------------------------------------------------------------------- */
const DemoData = {
  // Chỉ tái sử dụng TIÊU ĐỀ CỘT theo mẫu biểu lương (không phải số liệu)
  H1: ['STT', 'Mã nhân viên', 'Họ tên', 'Đơn vị', 'Tên vị trí', 'Nhóm lương', 'BRCĐ', '', '', '', '', '', '', '', '', '', '', 'TSL, INTERNET TRỰC TIẾP, KÊNH THUÊ RIÊNG', '', '', '', '', '', '', 'VNP trả trước + trả sau', '', '', '', '', '', 'CNTT', '', '', 'Lương quản lý (kỹ thuật)', 'Lương  quản lý (kinh doanh)', 'Lương dịch chuyển, lắp đặt', 'Lương xử lý (ngoài địa bàn)', 'Lương thu hồi thiết bị', 'Lương thu cước, thu nợ', '', '', 'Lương chăm sóc điểm bán'],
  H2: ['', '', '', '', '', '', 'Phát triển mới', 'Khuyến khích PTM', 'Đóng trước cước, nâng cấp, hạ cấp', 'KK: đóng trước cước, nâng cấp, hạ cấp', 'Rời mạng', 'KK rời mạng', 'KK lắp đặt, khảo sát', 'Bổ sung/Điều chỉnh tháng trước', 'KK bổ sung/điều chỉnh tháng trước', 'Gia hạn', 'Tổng lương BRCĐ', 'Phát triển mới', 'KK phát triển mới', 'Đóng trước cước, nâng gói, hạ gói trên thuê bao hiện  hữu', 'KK: đóng trước cước, nâng gói, hạ gói trên thuê bao hiện hữu', 'Rời mạng', 'KK rời mạng', 'Tổng lương TSL, KTR…', 'PTM', 'KK PTM', 'Gia hạn, bán gói, nâng gói, nâng chu kỳ trên sim hiện hữu', 'KK: Gia hạn, bán gói, nâng gói, nâng chu kỳ trên sim hiện hữu', 'Đóng trước cước trên thuê bao trả sau', 'Tổng lương VNP', 'PTM, gia hạn, RM', 'Khuyến khích', 'Tổng lương CNTT', '', '', '', '', '', 'Lương thu cước', 'Lương thu nợ', 'Lương KK thu cước', ''],
  rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  build() {
    const R = this.rng(20260915), rnd = (a, b) => Math.round((a + R() * (b - a)) / 100) * 100;
    const units = ['Đơn vị minh họa A', 'Đơn vị minh họa B', 'Đơn vị minh họa C', 'Đơn vị minh họa D'];
    const titles = [['Kỹ thuật viên (minh họa)', 'BH', 'KT'], ['Nhân viên kinh doanh (minh họa)', 'BH', 'KD'], ['Giao dịch viên (minh họa)', 'BH', 'GDV'], ['Tổ trưởng (minh họa)', 'QL', 'KT']];
    const rows = [], C = x => U.colToNum(x) - 1;
    let no = 0;
    for (const u of units) {
      const n = 8 + Math.floor(R() * 5);
      for (let i = 0; i < n; i++) {
        no++;
        const t = i === 0 ? titles[3] : titles[Math.floor(R() * 3)];
        const r = new Array(42).fill(0);
        r[0] = no; r[1] = 'MH' + String(no).padStart(4, '0'); r[2] = 'Người lao động minh họa ' + String(no).padStart(2, '0');
        r[3] = u; r[4] = t[0]; r[5] = t[1];
        const zero = R() < 0.06;
        if (!zero) {
          if (t[2] === 'KT') {
            r[C('G')] = rnd(3e5, 2.6e6); r[C('H')] = rnd(0, 9e5); r[C('I')] = rnd(0, 2e5); r[C('K')] = R() < .35 ? -rnd(5e4, 4e5) : 0;
            r[C('M')] = rnd(2e5, 2e6); r[C('O')] = R() < .7 ? rnd(5e4, 2e5) : 0; r[C('P')] = rnd(1e5, 3e6) + 0.25;
            r[C('AE')] = R() < .2 ? rnd(1e5, 8e5) : 0; r[C('AF')] = r[C('AE')] ? rnd(2e5, 2e6) : 0;
          } else if (t[2] === 'KD') {
            r[C('G')] = rnd(5e5, 6e6); r[C('H')] = rnd(0, 4e6); r[C('I')] = rnd(0, 4e5); r[C('P')] = rnd(0, 3e6) + 0.5;
            r[C('Y')] = rnd(1e5, 1.5e6); r[C('Z')] = rnd(3e5, 3e6); r[C('AA')] = rnd(0, 1e5); r[C('AB')] = rnd(0, 2e5);
            r[C('AI')] = rnd(1e6, 5e6); r[C('AM')] = rnd(1e6, 4e6); r[C('AN')] = rnd(0, 5e5); r[C('AO')] = rnd(3e5, 1.3e6);
            r[C('R')] = R() < .25 ? rnd(1e5, 1e6) : 0; r[C('S')] = r[C('R')] ? rnd(1e5, 8e5) : 0;
          } else if (t[2] === 'GDV') {
            r[C('G')] = rnd(2e5, 1.5e6); r[C('Y')] = rnd(4e6, 1.6e7); r[C('Z')] = rnd(1e7, 4e7); r[C('AA')] = rnd(0, 1e5); r[C('AB')] = rnd(0, 2e5);
            r[C('AC')] = R() < .3 ? rnd(1e4, 5e4) : 0; r[C('AN')] = R() < .5 ? rnd(5e4, 3e5) : 0; r[C('K')] = R() < .2 ? -rnd(9e4, 2.3e5) : 0;
          }
        }
        r[C('Q')] = ['G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P'].reduce((s, k) => s + r[C(k)], 0);
        r[C('X')] = ['R', 'S', 'T', 'U', 'V', 'W'].reduce((s, k) => s + r[C(k)], 0);
        r[C('AD')] = ['Y', 'Z', 'AA', 'AB', 'AC'].reduce((s, k) => s + r[C(k)], 0);
        r[C('AG')] = r[C('AE')] + r[C('AF')];
        rows.push(r);
      }
    }
    const tot = new Array(42).fill(null); tot[4] = 'Tổng';
    for (let c = 6; c < 42; c++) tot[c] = rows.reduce((s, r) => s + r[c], 0);
    const th = [[], [], ['DỮ LIỆU MINH HỌA – KHÔNG PHẢI SỐ LIỆU LƯƠNG THẬT'], [], [], [], [], this.H1, this.H2, tot, [], ...rows];
    // Chi tiết minh họa: chia số tiền từng hạng mục thành các mã thuê bao giả lập
    const ct = [[], [], [], [null, 'Mã HRM', 'Mã tb', 'ID tổng hợp', 'Tiền', 'ID loại tiền']];
    const kkCols = new Set(['H', 'J', 'L', 'M', 'O', 'S', 'U', 'W', 'Z', 'AB', 'AF', 'AO']);
    let tb = 1000;
    const leaves = ['G', 'H', 'I', 'K', 'M', 'O', 'P', 'R', 'S', 'Y', 'Z', 'AA', 'AB', 'AC', 'AE', 'AF', 'AM', 'AN', 'AO'];
    rows.forEach((r, ri) => {
      for (const k of leaves) {
        const v = r[C(k)]; if (!v) continue;
        const parts = 1 + Math.floor(R() * 4); let left = v;
        for (let p = 0; p < parts; p++) {
          const amt = p === parts - 1 ? left : Math.round(v / parts);
          left -= amt; tb += 1 + Math.floor(R() * 37);
          ct.push([null, r[1], 'MHTB' + String(tb).padStart(7, '0'), 'TH_' + k, amt, kkCols.has(k) ? 2 : 1]);
        }
      }
      if (ri === 3) ct.push([null, r[1], 'MHTB0000001', 'TH_G', 50000, 1]); // cố ý lệch để minh họa chênh lệch đối soát
    });
    ct.push([null, 'MH9999', 'MHTB0000002', 'TH_G', 120000, 1]); // cố ý: mã HRM không tồn tại
    ct.push([null, rows[1][1], 'MHTB0000003', 'TH_X9', 30000, 9]); // cố ý: ID tổng hợp & loại tiền chưa ánh xạ
    const lt = [[], [null, null, 'Loại tiền', 'ID loại tiền'], [null, null, 'Lương PTM…', 1], [null, null, 'Lương KK', 2]];
    return { wb: XlsxReader.fromAOA({ 'Tổng hợp': th, 'Chi tiết': ct, 'Loại tiền': lt }), idMap: Object.fromEntries(leaves.map(k => ['TH_' + k, k])) };
  },
};

/* ---------------------------------------------------------------------
 * LỚP 3 – Calc: các phép tính dùng chung (máy chủ & giao diện)
 * ------------------------------------------------------------------- */
const Calc = {
  leaves(meta) { return meta.columns.filter(c => !c.isTotal); },
  col(meta, key) { return meta._colMap ? meta._colMap[key] : (meta._colMap = Object.fromEntries(meta.columns.map(c => [c.key, c])))[key]; },
  /** Danh sách cột tạo nên “số tiền đang xét” theo bộ lọc mảng/hạng mục/tính chất */
  measureCols(meta, f = {}) {
    return this.leaves(meta).filter(c =>
      (f.col ? c.key === f.col : meta.formula.included[c.key]) &&
      (!f.domain || c.domain === f.domain) &&
      (!f.nature || (f.nature === 'kk') === c.isKK)).map(c => c.key);
  },
  val(e, keys) { let s = 0; for (const k of keys) s += e.values[k] || 0; return s; },
  stats(vals) {
    if (!vals.length) return { n: 0, sum: 0, avg: null, median: null, max: null, min: null };
    const sum = U.sum(vals);
    return { n: vals.length, sum, avg: sum / vals.length, median: U.median(vals), max: Math.max(...vals), min: Math.min(...vals) };
  },
  /** Thống kê theo mẫu số đã chọn: 'all' = toàn bộ nhân sự; 'active' = nhân sự có phát sinh (≠ 0) */
  popStats(emps, keys, denom) {
    const vals = emps.map(e => this.val(e, keys));
    return this.stats(denom === 'active' ? vals.filter(v => Math.abs(v) >= 0.005) : vals);
  },
  kpis(meta, emps, f, denom) {
    const keys = this.measureCols(meta, f);
    const kL = keys.filter(k => !this.col(meta, k).isKK), kK = keys.filter(k => this.col(meta, k).isKK);
    const vals = emps.map(e => this.val(e, keys));
    const st = this.popStats(emps, keys, denom);
    return {
      keys, luong: U.sum(emps, e => this.val(e, kL)), kk: U.sum(emps, e => this.val(e, kK)), total: U.sum(vals),
      nAll: emps.length, nActive: vals.filter(v => Math.abs(v) >= 0.005).length,
      nComplete: emps.filter(e => e.complete).length, nZero: vals.filter(v => Math.abs(v) < 0.005).length,
      nNeg: vals.filter(v => v <= -0.005).length, avg: st.avg, median: st.median, nDen: st.n,
      units: U.uniq(emps.map(e => e.unit)).length,
    };
  },
  domainBreakdown(meta, emps, f) {
    const keys = this.measureCols(meta, f);
    return DOMAIN_ORDER.map(d => {
      const ks = keys.filter(k => this.col(meta, k).domain === d);
      if (!this.leaves(meta).some(c => c.domain === d)) return null;
      const kk = ks.filter(k => this.col(meta, k).isKK);
      return {
        d, name: DOMAINS[d].name, short: DOMAINS[d].short, keys: ks,
        total: U.sum(emps, e => this.val(e, ks)), kk: U.sum(emps, e => this.val(e, kk)),
        luong: U.sum(emps, e => this.val(e, ks.filter(k => !kk.includes(k)))),
        nActive: emps.filter(e => Math.abs(this.val(e, ks)) >= 0.005).length,
      };
    }).filter(Boolean);
  },
  leafBreakdown(meta, emps, f, withExcluded = false) {
    const inc = new Set(this.measureCols(meta, f));
    return this.leaves(meta).filter(c => inc.has(c.key) || (withExcluded && !meta.formula.included[c.key] &&
      (!f.domain || c.domain === f.domain) && (!f.nature || (f.nature === 'kk') === c.isKK) && (!f.col || f.col === c.key)))
      .map(c => ({ col: c, included: inc.has(c.key) && meta.formula.included[c.key], total: U.sum(emps, e => e.values[c.key] || 0), nActive: emps.filter(e => Math.abs(e.values[c.key] || 0) >= 0.005).length }));
  },
  groupStats(meta, emps, f, denom, keyFn) {
    const keys = this.measureCols(meta, f), m = new Map();
    for (const e of emps) { const k = keyFn(e); (m.get(k) || m.set(k, []).get(k)).push(e); }
    return [...m.entries()].map(([k, list]) => {
      const st = this.popStats(list, keys, denom);
      const kk = keys.filter(x => this.col(meta, x).isKK);
      const total = U.sum(list, e => this.val(e, keys));
      const dom = {};
      for (const d of DOMAIN_ORDER) dom[d] = U.sum(list, e => this.val(e, keys.filter(x => this.col(meta, x).domain === d)));
      return { key: k, emps: list, nAll: list.length, n: st.n, total, avg: st.avg, median: st.median, max: st.max, min: st.min, kk: U.sum(list, e => this.val(e, kk)), dom };
    });
  },
  /** Lọc dòng chi tiết theo ngữ cảnh. Dòng chưa ánh xạ ID tổng hợp chỉ hiện khi ngữ cảnh không giới hạn hạng mục. */
  detailRows(meta, details, f) {
    const keys = new Set(this.measureCols(meta, f));
    const specific = !!(f.domain || f.col || f.nature);
    let rows = details.filter(d => !f.typeId || d.typeId === f.typeId);
    const unmapped = rows.filter(d => !d.col);
    rows = rows.filter(d => d.col ? keys.has(d.col) : !specific);
    return { rows, unmappedHidden: specific ? unmapped.length : 0, unmappedShown: specific ? 0 : unmapped.length };
  },
  /** Đối soát Tổng hợp ↔ Chi tiết – chỉ khi đủ căn cứ */
  recon(meta, emps, details, f) {
    if (!meta.detailTotal) return { status: 'nodetail', msg: 'Chưa đủ căn cứ đối soát: sheet “Chi tiết” của kỳ này không có dòng dữ liệu.' };
    if (f.typeId) return { status: 'typefilter', msg: 'Không đối soát khi đang lọc “Loại tiền”: sheet Tổng hợp không tách số tiền theo loại tiền.' };
    const scoped = details;
    const unm = scoped.filter(d => !d.col).length;
    if (unm) return { status: 'unmapped', msg: `Chưa xác định công thức đối soát: còn ${unm} dòng chi tiết chưa ánh xạ “ID tổng hợp” → hạng mục (khai báo tại trang Cấu hình công thức).` };
    const dc = new Set(meta.detailCols);
    const keys = this.measureCols(meta, f).filter(k => dc.has(k));
    if (!keys.length) return { status: 'nocols', msg: 'Các hạng mục đang xét không có dòng chi tiết nào trong file → không đối soát (giả định: chỉ đối soát hạng mục có dữ liệu chi tiết).' };
    const summary = U.sum(emps, e => this.val(e, keys));
    const ks = new Set(keys);
    const detail = U.sum(scoped.filter(d => ks.has(d.col)), d => d.amount);
    return { status: 'ok', summary, detail, diff: summary - detail, keys, msg: `Đối soát trên ${keys.length} hạng mục có dữ liệu chi tiết.` };
  },
};

/* ---------------------------------------------------------------------
 * LỚP 4 – MockServer: GIẢ LẬP BACKEND trong trình duyệt (chỉ cho bản demo)
 * Mọi dữ liệu lương chỉ được trả ra sau khi kiểm tra phiên + phạm vi quyền.
 * LƯU Ý: vì chạy trong cùng trình duyệt, đây KHÔNG phải cơ chế bảo mật thật.
 * ------------------------------------------------------------------- */
const MockServer = (() => {
  const db = { datasets: new Map(), accounts: new Map(), sessions: new Map(), audit: [] };
  const IDLE_MS = 30 * 60 * 1000, MAX_FAIL = 5;
  const LEVELS = { 1: 'Cấp 1 – Quản trị/Điều hành toàn Viễn thông', 2: 'Cấp 2 – Quản lý đơn vị/địa bàn', 3: 'Cấp 3 – Người lao động' };
  const EXPORT_RULES = { tonghop: [1], donvi: [1, 2], chucdanh: [1, 2], top5dv: [1], top5nv: [1, 2], bangke: [1, 2, 3], chitiet: [1, 2, 3], doisoat: [1] };
  const err = (code, msg) => Object.assign(new Error(msg), { code });
  const hashPw = (salt, pw) => { let h = salt + ':' + pw; for (let i = 0; i < 300; i++) h = Sha256(h + salt); return h; };
  const pub = a => ({ hrm: a.hrm, name: a.name, title: a.title, unit: a.unit, level: a.level, levelName: LEVELS[a.level], status: a.status, builtin: !!a.builtin, failed: a.failed, lastLogin: a.lastLogin || null, canExportPersonal: a.canExportPersonal !== false });
  function upsertAccount(o, actor) {
    const hrm = String(o.hrm || '').trim();
    if (!hrm) throw err(400, 'Thiếu Mã HRM.');
    if (![1, 2, 3].includes(+o.level)) throw err(400, 'Cấp phân quyền không hợp lệ.');
    if (+o.level === 2 && !o.unit) throw err(400, 'Tài khoản cấp 2 phải được phân công đơn vị.');
    const old = db.accounts.get(hrm);
    const a = Object.assign(old || { hrm, failed: 0 }, {
      name: o.name ?? old?.name ?? '', title: o.title ?? old?.title ?? '', unit: o.unit ?? old?.unit ?? '',
      level: +o.level, status: o.status || old?.status || 'active', canExportPersonal: o.canExportPersonal !== false, builtin: old?.builtin || o.builtin,
    });
    if (o.password) { if (String(o.password).length < 6) throw err(400, 'Mật khẩu tối thiểu 6 ký tự.'); a.salt = U.uid(8); a.hash = hashPw(a.salt, o.password); }
    if (!a.hash) throw err(400, 'Tài khoản mới phải có mật khẩu.');
    if (a.status === 'active') a.failed = 0;
    db.accounts.set(hrm, a);
    if (actor) log(actor, old ? 'Cập nhật tài khoản' : 'Tạo tài khoản', hrm + ' – cấp ' + a.level);
    return pub(a);
  }
  // Tài khoản quản trị dùng thử (CHỈ cho bản demo)
  upsertAccount({ hrm: 'QTDEMO', name: 'Quản trị viên (demo)', title: 'Quản trị hệ thống', unit: 'Toàn Viễn thông Hải Phòng', level: 1, password: 'Demo@2026', builtin: true });
  // Tài khoản khởi tạo từ danh sách lao động (mật khẩu đã băm sẵn, không có mật khẩu dạng chữ trong mã nguồn)
  if (typeof SEED_ACCOUNTS !== 'undefined') for (const [hrm, name, title, unit, level, salt, hash] of SEED_ACCOUNTS)
    db.accounts.set(hrm, { hrm, name, title, unit, level, status: 'active', canExportPersonal: true, salt, hash, failed: 0, seeded: true });

  function log(acc, action, detail = '') { db.audit.unshift({ at: Date.now(), hrm: acc.hrm, action, detail }); if (db.audit.length > 500) db.audit.pop(); }
  function auth(token) {
    const s = db.sessions.get(token);
    if (!s) throw err(401, 'Phiên đăng nhập không hợp lệ hoặc đã hết hạn.');
    if (Date.now() - s.last > IDLE_MS) { db.sessions.delete(token); throw err(401, 'Phiên đăng nhập đã hết hạn do không thao tác quá 30 phút.'); }
    const acc = db.accounts.get(s.hrm);
    if (!acc || acc.status !== 'active') { db.sessions.delete(token); throw err(401, 'Tài khoản đã bị khóa hoặc không còn tồn tại.'); }
    s.last = Date.now();
    return acc;
  }
  const need = (acc, lv) => { if (acc.level > lv) throw err(403, 'Không có quyền thực hiện thao tác này.'); };
  const getDs = pid => { const d = db.datasets.get(pid); if (!d) throw err(404, 'Không tìm thấy kỳ lương.'); return d; };
  /** Phạm vi dữ liệu theo quyền – áp dụng TRƯỚC mọi bộ lọc */
  function scopeEmps(acc, d) {
    if (acc.level === 1) return d.employees;
    if (acc.level === 2) return d.employees.filter(e => e.unit === acc.unit);
    return d.employees.filter(e => e.hrm === acc.hrm);
  }
  function applyQuery(acc, list, q = {}) {
    if (q.unit && acc.level === 2 && q.unit !== acc.unit) throw err(403, 'Từ chối: không được xem dữ liệu của đơn vị khác.');
    if (acc.level === 3 && ((q.hrm && q.hrm !== acc.hrm) || (q.hrms && q.hrms.some(h => h !== acc.hrm)))) throw err(403, 'Từ chối: không được xem dữ liệu của người lao động khác.');
    const s = q.q ? U.norm(q.q) : '';
    return list.filter(e => (!q.unit || e.unit === q.unit) && (!q.title || e.title === q.title) && (!q.payGroup || e.payGroup === q.payGroup) &&
      (!q.hrm || e.hrm === q.hrm) && (!q.hrms || q.hrms.includes(e.hrm)) && (!s || U.norm(e.hrm).includes(s) || U.norm(e.name).includes(s)));
  }
  const strip = e => ({ hrm: e.hrm, name: e.name, unit: e.unit, title: e.title, payGroup: e.payGroup, stt: e.stt, row: e.row, values: { ...e.values }, blanks: [...e.blanks], bad: [...e.bad], complete: e.complete });
  function metaOf(acc, d) {
    const sc = scopeEmps(acc, d);
    const dc = U.uniq(d.details.filter(x => d.idMap[x.idTH]).map(x => d.idMap[x.idTH]));
    return U.clone({
      id: d.id, period: d.period, source: d.source, sample: !!d.sample, fileName: d.fileName, loadedAt: d.loadedAt,
      columns: d.columns, groups: d.groups.map(g => ({ key: g.key, name: g.name, domain: g.domain, cols: g.cols, totalCol: g.totalCol, check: g.check })),
      formula: d.formula, idMap: d.idMap, moneyTypes: d.moneyTypes, detailTotal: d.details.length, detailCols: dc,
      units: U.uniq(sc.map(e => e.unit)).sort(), titles: U.uniq(sc.map(e => e.title)).sort(), payGroups: U.uniq(sc.map(e => e.payGroup)).sort(),
      scopeCount: sc.length, scope: { level: acc.level, unit: acc.unit, hrm: acc.hrm },
      allUnits: acc.level === 1 ? U.uniq(d.employees.map(e => e.unit)).sort() : undefined,
    });
  }
  const delay = v => new Promise(r => setTimeout(() => r(v), 0));
  const run = fn => { try { return delay(fn()); } catch (e) { return Promise.reject(e); } };

  return {
    LEVELS, EXPORT_RULES,
    login: (hrm, pw) => run(() => {
      const a = db.accounts.get(String(hrm || '').trim().toUpperCase()) || db.accounts.get(String(hrm || '').trim());
      if (!a) throw err(401, 'Sai mã HRM hoặc mật khẩu.');
      if (a.status !== 'active') throw err(401, a.status === 'locked' ? 'Tài khoản đang bị khóa. Liên hệ quản trị.' : 'Tài khoản không hoạt động.');
      if (hashPw(a.salt, pw) !== a.hash) {
        a.failed = (a.failed || 0) + 1;
        if (a.failed >= MAX_FAIL && !a.builtin) { a.status = 'locked'; log(a, 'Khóa tài khoản', 'Sai mật khẩu ' + MAX_FAIL + ' lần'); }
        throw err(401, 'Sai mã HRM hoặc mật khẩu.' + (a.failed >= 3 && !a.builtin ? ` (đã sai ${a.failed}/${MAX_FAIL} lần)` : ''));
      }
      a.failed = 0; a.lastLogin = Date.now();
      const token = U.uid(24);
      db.sessions.set(token, { hrm: a.hrm, last: Date.now() });
      log(a, 'Đăng nhập');
      return { token, user: pub(a) };
    }),
    logout: token => run(() => { const s = db.sessions.get(token); if (s) { const a = db.accounts.get(s.hrm); if (a) log(a, 'Đăng xuất'); } db.sessions.delete(token); return true; }),
    me: token => run(() => pub(auth(token))),
    changePassword: (token, oldPw, newPw) => run(() => {
      const a = auth(token);
      if (hashPw(a.salt, oldPw) !== a.hash) throw err(400, 'Mật khẩu hiện tại không đúng.');
      if (String(newPw).length < 6) throw err(400, 'Mật khẩu mới tối thiểu 6 ký tự.');
      a.salt = U.uid(8); a.hash = hashPw(a.salt, newPw); log(a, 'Đổi mật khẩu'); return true;
    }),
    periods: token => run(() => { auth(token); return [...db.datasets.values()].map(d => ({ id: d.id, period: d.period, source: d.source, fileName: d.fileName, loadedAt: d.loadedAt })); }),
    meta: (token, pid) => run(() => metaOf(auth(token), getDs(pid))),
    employees: (token, pid, q) => run(() => { const a = auth(token); return applyQuery(a, scopeEmps(a, getDs(pid)), q).map(strip); }),
    /** Dòng chi tiết: chỉ của nhân sự trong phạm vi quyền ∩ danh sách yêu cầu */
    details: (token, pid, q = {}) => run(() => {
      const a = auth(token), d = getDs(pid);
      const allowed = new Set(applyQuery(a, scopeEmps(a, d), q).map(e => e.hrm));
      const tn = Object.fromEntries(d.moneyTypes.map(m => [m.id, m.name]));
      return d.details.filter(x => allowed.has(x.hrm)).map(x => ({ ...x, col: d.idMap[x.idTH] || null, typeName: tn[x.typeId] || null }));
    }),
    logView: (token, what) => run(() => { log(auth(token), 'Xem chi tiết', what); return true; }),
    quality: (token, pid) => run(() => {
      const a = auth(token); need(a, 1); const d = getDs(pid);
      const tn = Object.fromEntries(d.moneyTypes.map(m => [m.id, m.name]));
      return U.clone({
        ...metaOf(a, d), issues: d.issues, errorRows: d.errorRows, duplicates: d.duplicates, skippedBlank: d.skippedBlank,
        headerRow: d.headerRow, subHeaderRow: d.subHeaderRow, detailHeaderRow: d.detailHeaderRow, sheets: d.sheets, sheetNames: d.sheetNames,
        totalRow: d.totalRow, nEmployees: d.employees.length,
        orphanDetails: d.details.filter(x => !x.matched).map(x => ({ ...x, col: d.idMap[x.idTH] || null, typeName: tn[x.typeId] || null })),
        idThValues: U.uniq(d.details.map(x => x.idTH)), blanksByCol: Object.fromEntries(d.columns.map(c => [c.key, d.employees.filter(e => e.blanks.includes(c.key)).length])),
      });
    }),
    upload: (token, wb, meta, extra = {}) => run(() => {
      const a = auth(token); need(a, 1);
      const d = PayrollParser.parse(wb, meta);
      if (extra.idMap) { d.idMap = extra.idMap; d.idMapSource = 'demo'; }
      db.datasets.set(d.id, d);
      log(a, 'Tải dữ liệu', `${meta.fileName} – kỳ ${meta.period.label}`);
      return { id: d.id, employees: d.employees.length, details: d.details.length, issues: d.issues.length };
    }),
    removeDataset: (token, pid) => run(() => { const a = auth(token); need(a, 1); getDs(pid); db.datasets.delete(pid); log(a, 'Xóa kỳ dữ liệu', pid); return true; }),
    setFormula: (token, pid, included) => run(() => {
      const a = auth(token); need(a, 1); const d = getDs(pid);
      for (const c of d.columns) if (!c.isTotal) d.formula.included[c.key] = !!included[c.key];
      d.formula.confirmed = null; log(a, 'Sửa công thức tổng thu nhập', d.period.label); return true;
    }),
    confirmFormula: (token, pid) => run(() => {
      const a = auth(token); need(a, 1); const d = getDs(pid);
      d.formula.confirmed = { by: a.hrm + ' – ' + a.name, at: Date.now() }; log(a, 'Xác nhận công thức', d.period.label); return true;
    }),
    setIdMap: (token, pid, map) => run(() => {
      const a = auth(token); need(a, 1); const d = getDs(pid);
      const keys = new Set(d.columns.filter(c => !c.isTotal).map(c => c.key));
      d.idMap = Object.fromEntries(Object.entries(map).filter(([, v]) => keys.has(v)));
      d.idMapSource = 'manual'; log(a, 'Khai báo ánh xạ ID tổng hợp', Object.keys(d.idMap).length + ' mã'); return true;
    }),
    accounts: {
      list: token => run(() => { need(auth(token), 1); return [...db.accounts.values()].map(pub); }),
      save: (token, o) => run(() => { const a = auth(token); need(a, 1); return upsertAccount(o, a); }),
      remove: (token, hrm) => run(() => {
        const a = auth(token); need(a, 1);
        const t = db.accounts.get(hrm); if (!t) throw err(404, 'Không tìm thấy tài khoản.');
        if (t.builtin) throw err(400, 'Không xóa tài khoản quản trị demo.');
        if (hrm === a.hrm) throw err(400, 'Không tự xóa tài khoản đang đăng nhập.');
        db.accounts.delete(hrm); for (const [k, s] of db.sessions) if (s.hrm === hrm) db.sessions.delete(k);
        log(a, 'Xóa tài khoản', hrm); return true;
      }),
      bulkCreate: (token, pid, password) => run(() => {
        const a = auth(token); need(a, 1); const d = getDs(pid); let n = 0;
        for (const e of d.employees) if (!db.accounts.has(e.hrm)) { upsertAccount({ hrm: e.hrm, name: e.name, title: e.title, unit: e.unit, level: 3, password }); n++; }
        log(a, 'Tạo tài khoản hàng loạt', n + ' tài khoản cấp 3'); return n;
      }),
      exportJson: token => run(() => { const a = auth(token); need(a, 1); log(a, 'Xuất danh sách tài khoản'); return [...db.accounts.values()].filter(x => !x.builtin).map(x => ({ hrm: x.hrm, name: x.name, title: x.title, unit: x.unit, level: x.level, status: x.status, canExportPersonal: x.canExportPersonal !== false, salt: x.salt, hash: x.hash })); }),
      importJson: (token, arr) => run(() => {
        const a = auth(token); need(a, 1); let n = 0;
        for (const x of arr) {
          if (!x.hrm || !x.salt || !x.hash || ![1, 2, 3].includes(+x.level) || x.hrm === 'QTDEMO') continue;
          db.accounts.set(String(x.hrm), { hrm: String(x.hrm), name: x.name || '', title: x.title || '', unit: x.unit || '', level: +x.level, status: x.status === 'locked' ? 'locked' : 'active', canExportPersonal: x.canExportPersonal !== false, salt: x.salt, hash: x.hash, failed: 0 });
          n++;
        }
        log(a, 'Nhập danh sách tài khoản', n + ' tài khoản'); return n;
      }),
    },
    /** Kiểm tra quyền xuất báo cáo tại “máy chủ” */
    canExport: (token, pid, type, p = {}) => run(() => {
      const a = auth(token);
      if (!(EXPORT_RULES[type] || []).includes(a.level)) throw err(403, 'Không có quyền xuất báo cáo này.');
      if (type === 'bangke') {
        if (a.level === 3 && a.canExportPersonal === false) throw err(403, 'Tài khoản chưa được cấp quyền tải bảng kê cá nhân.');
        if (!scopeEmps(a, getDs(pid)).some(e => e.hrm === p.hrm)) throw err(403, 'Nhân sự nằm ngoài phạm vi được xem.');
      }
      log(a, 'Xuất báo cáo', type + (p.hrm ? ' – ' + p.hrm : ''));
      return true;
    }),
    audit: token => run(() => { need(auth(token), 1); return db.audit.slice(0, 200); }),
  };
})();

/* ---------------------------------------------------------------------
 * LỚP 5 – Api: giao diện chỉ gọi qua lớp này.
 * Khi có backend thật: thay thân hàm bằng fetch() tới các endpoint gợi ý:
 *   POST /api/auth/login · POST /api/auth/logout · GET /api/me
 *   GET  /api/periods · GET /api/periods/:id/meta
 *   GET  /api/periods/:id/employees?unit=&title=&payGroup=&q=&hrm=
 *   GET  /api/periods/:id/details?hrms=…   (máy chủ lọc theo quyền)
 *   GET  /api/periods/:id/quality · POST /api/periods (multipart Excel)
 *   PUT  /api/periods/:id/formula · PUT /api/periods/:id/idmap
 *   GET/POST/PUT/DELETE /api/accounts · GET /api/exports/:type
 * Mọi endpoint xác thực bằng phiên/token HttpOnly và lọc phạm vi tại máy chủ.
 * ------------------------------------------------------------------- */
const Api = {
  token: null,
  onUnauthorized: null,
  async call(fn, ...args) {
    try { return await fn(this.token, ...args); }
    catch (e) { if (e.code === 401 && this.onUnauthorized) this.onUnauthorized(e.message); throw e; }
  },
  async login(hrm, pw) { const r = await MockServer.login(hrm, pw); this.token = r.token; return r.user; },
  async logout() { if (this.token) await MockServer.logout(this.token); this.token = null; },
  me() { return this.call(MockServer.me); },
  changePassword(o, n) { return this.call(MockServer.changePassword, o, n); },
  periods() { return this.call(MockServer.periods); },
  meta(pid) { return this.call(MockServer.meta, pid); },
  employees(pid, q) { return this.call(MockServer.employees, pid, q); },
  details(pid, q) { return this.call(MockServer.details, pid, q); },
  logView(what) { return this.call(MockServer.logView, what); },
  quality(pid) { return this.call(MockServer.quality, pid); },
  _wbCache: null,
  async uploadExcel(file, period) {
    const c = this._wbCache;
    const wb = c && c.file === file ? c.wb : await XlsxReader.read(await file.arrayBuffer());
    this._wbCache = null;
    return this.call(MockServer.upload, wb, { period, source: 'excel', fileName: file.name });
  },
  async readPeriodHint(file) {
    try { const wb = await XlsxReader.read(await file.arrayBuffer()); this._wbCache = { file, wb }; return PayrollParser.detectPeriod(wb); }
    catch { this._wbCache = null; return null; }
  },
  loadDemo() {
    const { wb, idMap } = DemoData.build();
    return this.call(MockServer.upload, wb, { period: { code: '', label: 'MINH HỌA' }, source: 'demo', fileName: 'Dữ liệu minh họa (tự sinh)' }, { idMap });
  },
  removeDataset(pid) { return this.call(MockServer.removeDataset, pid); },
  setFormula(pid, inc) { return this.call(MockServer.setFormula, pid, inc); },
  confirmFormula(pid) { return this.call(MockServer.confirmFormula, pid); },
  setIdMap(pid, m) { return this.call(MockServer.setIdMap, pid, m); },
  accounts: {
    list: () => Api.call(MockServer.accounts.list),
    save: o => Api.call(MockServer.accounts.save, o),
    remove: h => Api.call(MockServer.accounts.remove, h),
    bulkCreate: (pid, pw) => Api.call(MockServer.accounts.bulkCreate, pid, pw),
    exportJson: () => Api.call(MockServer.accounts.exportJson),
    importJson: arr => Api.call(MockServer.accounts.importJson, arr),
  },
  canExport(pid, type, p) { return this.call(MockServer.canExport, pid, type, p); },
  audit() { return this.call(MockServer.audit); },
};

/* ---------- Tooltip & Toast ---------- */
const Tip = {
  el: null,
  show(html, e) {
    if (!this.el) { this.el = document.createElement('div'); this.el.className = 'tip'; document.body.appendChild(this.el); }
    this.el.innerHTML = html; this.el.style.display = 'block';
    const r = this.el.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    this.el.style.left = Math.max(4, x) + 'px'; this.el.style.top = Math.max(4, y) + 'px';
  },
  hide() { if (this.el) this.el.style.display = 'none'; },
};
function toast(msg, err = false) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.setAttribute('role', 'status');
  const prev = [...document.querySelectorAll('.toast')]; t.style.bottom = (16 + prev.reduce((h, x) => h + x.offsetHeight + 8, 0)) + 'px';
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3500);
}

/* ---------- Biểu đồ SVG ---------- */
const Charts = {
  reg: new Map(), ro: null,
  mount(el, type, cfg) {
    if (!el) return;
    this.reg.set(el, { type, cfg });
    if (!this.ro && 'ResizeObserver' in window) this.ro = new ResizeObserver(U.debounce(ents => ents.forEach(en => this.reg.has(en.target) && this.draw(en.target)), 120));
    this.ro && this.ro.observe(el);
    this.draw(el);
  },
  cleanup() { for (const el of [...this.reg.keys()]) if (!document.body.contains(el)) { this.ro && this.ro.unobserve(el); this.reg.delete(el); } },
  draw(el) { const r = this.reg.get(el); if (r) this[r.type](el, r.cfg); },
  bind(el, cfg) {
    el.onclick = e => { const t = e.target.closest('[data-i]'); if (t && cfg.onClick) cfg.onClick(+t.dataset.i, +(t.dataset.s || 0)); };
    el.onmousemove = e => { const t = e.target.closest('[data-tip]'); t ? Tip.show(decodeURIComponent(t.dataset.tip), e) : Tip.hide(); };
    el.onmouseleave = () => Tip.hide();
  },
  ticks(lo, hi, n = 5) {
    const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0)), err = step0 / mag;
    const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
    const out = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * .001; v += step) out.push(+v.toFixed(10));
    return out;
  },
  trunc(s, px) { const n = Math.max(4, Math.floor(px / 6.1)); return s.length > n ? s.slice(0, n - 1) + '…' : s; },
  tipHtml(label, rows) { return encodeURIComponent(`<b>${U.esc(label)}</b>` + rows.map(([k, v, c]) => `<div>${c ? `<i style="display:inline-block;width:8px;height:8px;background:${c};border-radius:2px;margin-right:5px"></i>` : ''}${U.esc(k)}: <b>${U.money(v)}</b></div>`).join('')); },
  /** cfg: {labels, series:[{name,color,values}], stacked, horizontal, colorsByIndex, onClick, height, refLine:{value,label}} */
  bar(el, cfg) {
    const { labels, series } = cfg;
    if (!labels.length || series.every(s => s.values.every(v => !v))) { el.innerHTML = `<div class="chart-empty">${cfg.empty || 'Không có số liệu khác 0 trong phạm vi đang xem.'}</div>`; return; }
    const W = Math.max(280, el.clientWidth || 600), n = labels.length;
    const sums = labels.map((_, i) => cfg.stacked
      ? [U.sum(series, s => Math.min(0, s.values[i])), U.sum(series, s => Math.max(0, s.values[i]))]
      : [Math.min(0, ...series.map(s => s.values[i])), Math.max(0, ...series.map(s => s.values[i]))]);
    let lo = Math.min(0, ...sums.map(x => x[0])), hi = Math.max(0, ...sums.map(x => x[1]));
    if (cfg.refLine) { hi = Math.max(hi, cfg.refLine.value); lo = Math.min(lo, cfg.refLine.value); }
    if (hi === lo) hi = lo + 1;
    const tk = this.ticks(lo, hi); lo = Math.min(lo, tk[0]); hi = Math.max(hi, tk[tk.length - 1]);
    const color = (s, i) => (cfg.colorsByIndex && series.length === 1) ? cfg.colorsByIndex[i] : series[s].color;
    let svg = '';
    if (cfg.horizontal) {
      const rowH = 24, labW = Math.min(Math.max(110, W * .36), 280), padR = 70, H = n * rowH + 26;
      const x = v => labW + (v - lo) / (hi - lo) * (W - labW - padR);
      tk.forEach(t => svg += `<line class="gridl" x1="${x(t)}" x2="${x(t)}" y1="0" y2="${n * rowH}"/><text x="${x(t)}" y="${n * rowH + 15}" text-anchor="middle">${U.short(t)}</text>`);
      labels.forEach((l, i) => {
        const y = i * rowH;
        svg += `<text x="${labW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" data-i="${i}" style="cursor:pointer" data-tip="${this.tipHtml(l, series.map(s => [s.name, s.values[i], s.color]))}">${U.esc(this.trunc(l, labW - 12))}</text>`;
        let pos = 0, neg = 0;
        series.forEach((s, si) => {
          const v = s.values[i]; if (!v) return;
          let a, b;
          if (cfg.stacked) { if (v >= 0) { a = pos; b = pos += v; } else { b = neg; a = neg += v; } } else { a = Math.min(0, v); b = Math.max(0, v); }
          const bh = cfg.stacked ? rowH - 8 : (rowH - 8) / series.length, by = cfg.stacked ? y + 4 : y + 4 + si * bh;
          svg += `<rect class="bar" data-i="${i}" data-s="${si}" x="${x(a)}" y="${by}" width="${Math.max(1, x(b) - x(a))}" height="${bh}" rx="2" fill="${color(si, i)}" data-tip="${this.tipHtml(l, series.map(z => [z.name, z.values[i], z.color]))}"/>`;
        });
        const tot = cfg.stacked ? U.sum(series, s => s.values[i]) : series[0].values[i];
        svg += `<text x="${x(Math.max(0, cfg.stacked ? pos : tot)) + 5}" y="${y + rowH / 2 + 4}" style="fill:var(--text);font-weight:600">${U.short(tot)}</text>`;
      });
      svg += `<line class="axis" x1="${x(0)}" x2="${x(0)}" y1="0" y2="${n * rowH}"/>`;
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${U.esc(cfg.aria || 'Biểu đồ thanh ngang')}">${svg}</svg>`;
    } else {
      const H = cfg.height || 260, padL = 58, padR = 10, padT = 18;
      const maxLab = Math.max(...labels.map(l => l.length)), band = (W - padL - padR) / n;
      const rotate = maxLab * 6.1 > band - 6;
      const padB = rotate ? Math.min(90, 14 + Math.min(maxLab, 22) * 4.6) : 28;
      const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
      tk.forEach(t => svg += `<line class="gridl" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${U.short(t)}</text>`);
      labels.forEach((l, i) => {
        const x0 = padL + i * band, bw = Math.min(64, band * .7), gx = x0 + (band - bw) / 2;
        let pos = 0, neg = 0;
        series.forEach((s, si) => {
          const v = s.values[i]; if (!v) return;
          let a, b;
          if (cfg.stacked) { if (v >= 0) { a = pos; b = pos += v; } else { b = neg; a = neg += v; } } else { a = Math.min(0, v); b = Math.max(0, v); }
          const w = cfg.stacked ? bw : bw / series.length, xx = cfg.stacked ? gx : gx + si * w;
          svg += `<rect class="bar" data-i="${i}" data-s="${si}" x="${xx}" y="${y(b)}" width="${Math.max(1, w - 1)}" height="${Math.max(1, y(a) - y(b))}" rx="2" fill="${color(si, i)}" data-tip="${this.tipHtml(l, series.map(z => [z.name, z.values[i], z.color]))}"/>`;
        });
        const tot = cfg.stacked ? U.sum(series, s => s.values[i]) : Math.max(...series.map(s => s.values[i]));
        if (band > 34) svg += `<text x="${x0 + band / 2}" y="${y(Math.max(0, cfg.stacked ? pos : tot)) - 5}" text-anchor="middle" style="fill:var(--text);font-weight:600">${U.short(tot)}</text>`;
        const lab = U.esc(this.trunc(l, rotate ? 130 : band - 4));
        svg += rotate ? `<text data-i="${i}" style="cursor:pointer" transform="translate(${x0 + band / 2},${H - padB + 12}) rotate(-35)" text-anchor="end">${lab}</text>`
          : `<text data-i="${i}" style="cursor:pointer" x="${x0 + band / 2}" y="${H - padB + 16}" text-anchor="middle">${lab}</text>`;
      });
      svg += `<line class="axis" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
      if (cfg.refLine) svg += `<line x1="${padL}" x2="${W - padR}" y1="${y(cfg.refLine.value)}" y2="${y(cfg.refLine.value)}" stroke="#EF7D1A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - padR}" y="${y(cfg.refLine.value) - 5}" text-anchor="end" style="fill:#B35A0A;font-weight:700">${U.esc(cfg.refLine.label)}: ${U.short(cfg.refLine.value)}</text>`;
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${U.esc(cfg.aria || 'Biểu đồ cột')}">${svg}</svg>`;
    }
    this.bind(el, cfg);
  },
  /** cfg: {labels, values, colors, onClick, centerLabel} */
  donut(el, cfg) {
    const pos = cfg.values.map(v => Math.max(0, v)), tot = U.sum(pos);
    if (!tot) { el.innerHTML = `<div class="chart-empty">Không có số liệu dương để vẽ tỷ trọng.</div>`; return; }
    const S = 200, R = 92, r0 = 58, c = S / 2;
    let a0 = -Math.PI / 2, svg = '';
    pos.forEach((v, i) => {
      if (!v) return;
      const a1 = a0 + v / tot * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0;
      const p = (a, rr) => `${c + rr * Math.cos(a)},${c + rr * Math.sin(a)}`;
      const d = v / tot > 0.9999 ? `M${c - R},${c}a${R},${R} 0 1,0 ${2 * R},0a${R},${R} 0 1,0 ${-2 * R},0M${c - r0},${c}a${r0},${r0} 0 1,1 ${2 * r0},0a${r0},${r0} 0 1,1 ${-2 * r0},0`
        : `M${p(a0, R)}A${R},${R} 0 ${large} 1 ${p(a1, R)}L${p(a1, r0)}A${r0},${r0} 0 ${large} 0 ${p(a0, r0)}Z`;
      svg += `<path class="bar" fill-rule="evenodd" d="${d}" fill="${cfg.colors[i]}" data-i="${i}" data-tip="${encodeURIComponent(`<b>${U.esc(cfg.labels[i])}</b><div>${U.money(cfg.values[i])} · ${U.pct(v / tot)}</div>`)}"/>`;
      a0 = a1;
    });
    svg += `<text x="${c}" y="${c - 4}" text-anchor="middle" style="font-size:11px">${U.esc(cfg.centerLabel || 'Tổng')}</text><text x="${c}" y="${c + 14}" text-anchor="middle" style="font-size:14px;font-weight:800;fill:var(--brand-900)">${U.short(tot)}</text>`;
    const legend = cfg.labels.map((l, i) => `<button type="button" data-i="${i}"><i style="background:${cfg.colors[i]}"></i><span>${U.esc(l)}</span><span class="num">${U.short(cfg.values[i])}</span><span class="num muted">${cfg.values[i] < 0 ? 'âm' : U.pct(pos[i] / tot)}</span></button>`).join('');
    el.innerHTML = `<div class="donut-wrap"><div class="chart"><svg viewBox="0 0 ${S} ${S}" height="${S}" role="img" aria-label="Biểu đồ tỷ trọng">${svg}</svg></div><div class="donut-legend">${legend}</div></div>`;
    this.bind(el, cfg);
  },
};

/* ---------- Bảng dữ liệu: tìm kiếm, sắp xếp, phân trang ---------- */
class DataTable {
  constructor(el, o) {
    this.el = el; this.o = Object.assign({ pageSize: 15, search: true, searchPlaceholder: 'Tìm kiếm…' }, o);
    this.q = ''; this.page = 0; this.sortKey = o.sortKey || null; this.sortDir = o.sortDir || 'desc';
    this.render();
  }
  setRows(rows) { this.o.rows = rows; this.page = 0; this.renderBody(); }
  filtered() {
    let rows = this.o.rows;
    if (this.q) {
      const s = U.norm(this.q);
      rows = rows.filter(r => this.o.columns.some(c => c.searchable !== false && c.type !== 'money' && U.norm(c.value ? c.value(r) : r[c.key]).includes(s)));
    }
    if (this.sortKey) {
      const c = this.o.columns.find(x => x.key === this.sortKey);
      const get = c && c.value ? c.value : r => r[this.sortKey];
      const dir = this.sortDir === 'asc' ? 1 : -1;
      rows = [...rows].sort((a, b) => {
        const x = get(a), y = get(b);
        if (typeof x === 'number' || typeof y === 'number') return ((+x || 0) - (+y || 0)) * dir;
        return String(x ?? '').localeCompare(String(y ?? ''), 'vi') * dir;
      });
    }
    return rows;
  }
  render() {
    const o = this.o;
    this.el.innerHTML = `${o.search || o.tools ? `<div class="tbl-tools">${o.search ? `<input class="input" type="search" placeholder="${U.esc(o.searchPlaceholder)}" aria-label="Tìm trong bảng">` : ''}<span class="grow"></span>${o.tools || ''}</div>` : ''}
      <div class="tbl-wrap"><table class="tbl"><thead><tr>${o.columns.map(c => `<th class="${c.sortable === false ? '' : 'sortable'} ${c.type === 'money' || c.type === 'num' || c.type === 'pct' ? 'num' : ''}" data-k="${c.key}" ${c.title ? `title="${U.esc(c.title)}"` : ''}>${c.label}${c.sortable === false ? '' : '<span class="arr">▼</span>'}</th>`).join('')}</tr></thead><tbody></tbody><tfoot></tfoot></table></div><div class="pager"></div>`;
    const inp = this.el.querySelector('.tbl-tools input');
    if (inp) inp.oninput = U.debounce(() => { this.q = inp.value; this.page = 0; this.renderBody(); }, 200);
    this.el.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
      const k = th.dataset.k; if (this.sortKey === k) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc'; else { this.sortKey = k; this.sortDir = 'desc'; }
      this.renderBody();
    });
    this.renderBody();
  }
  cell(c, r) {
    if (c.render) return c.render(r);
    const v = c.value ? c.value(r) : r[c.key];
    if (c.type === 'money') return moneyBtn(v, c.ctx ? c.ctx(r) : null);
    if (c.type === 'num') return U.int(v);
    if (c.type === 'pct') return U.pct(v);
    return U.esc(v ?? '');
  }
  renderBody() {
    const o = this.o, rows = this.filtered(), ps = o.pageSize, pages = Math.max(1, Math.ceil(rows.length / ps));
    if (this.page >= pages) this.page = pages - 1;
    const slice = rows.slice(this.page * ps, this.page * ps + ps);
    this.el.querySelectorAll('th').forEach(th => { th.classList.toggle('sorted', th.dataset.k === this.sortKey); const a = th.querySelector('.arr'); if (a) a.textContent = th.dataset.k === this.sortKey && this.sortDir === 'asc' ? '▲' : '▼'; });
    const tb = this.el.querySelector('tbody');
    tb.innerHTML = slice.length ? slice.map((r, i) => `<tr class="${o.rowClass ? o.rowClass(r) : ''}">${o.columns.map(c => `<td class="${c.type === 'money' || c.type === 'num' || c.type === 'pct' ? 'num' : ''} ${c.cls || ''}">${c.key === '_stt' ? this.page * ps + i + 1 : this.cell(c, r)}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${o.columns.length}" class="muted" style="text-align:center;padding:20px">${o.emptyText || 'Không có dữ liệu.'}</td></tr>`;
    const tf = this.el.querySelector('tfoot');
    tf.innerHTML = o.footer && rows.length ? `<tr>${o.footer(rows).map((h, i) => `<td class="${['money', 'num', 'pct'].includes(o.columns[i]?.type) ? 'num' : ''}">${h ?? ''}</td>`).join('')}</tr>` : '';
    const pg = this.el.querySelector('.pager');
    pg.innerHTML = `<span>${U.int(rows.length)} dòng${rows.length !== o.rows.length ? ` (lọc từ ${U.int(o.rows.length)})` : ''}</span>` + (pages > 1 ? `
      <button class="btn sm" data-p="0" ${this.page === 0 ? 'disabled' : ''}>«</button><button class="btn sm" data-p="${this.page - 1}" ${this.page === 0 ? 'disabled' : ''}>‹</button>
      <span>Trang ${this.page + 1}/${pages}</span>
      <button class="btn sm" data-p="${this.page + 1}" ${this.page >= pages - 1 ? 'disabled' : ''}>›</button><button class="btn sm" data-p="${pages - 1}" ${this.page >= pages - 1 ? 'disabled' : ''}>»</button>` : '');
    pg.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { this.page = +b.dataset.p; this.renderBody(); });
    if (o.onRender) o.onRender(this);
  }
}

/* ---------------------------------------------------------------------
 * LỚP 7 – DetailModal: popup chi tiết khi bấm vào bất kỳ ô tiền nào
 * Dữ liệu được lấy lại từ Api theo đúng ngữ cảnh (máy chủ lọc theo quyền).
 * ------------------------------------------------------------------- */
const DetailModal = {
  stack: [], el: null, origin: null, scrollY: 0, tab: 'ct', st: {},
  async open(ctx, originEl) {
    if (!this.el) { this.origin = originEl; this.scrollY = window.scrollY; }
    this.stack = [ctx]; this.tab = 'ct'; await this.render();
  },
  async push(ctx) { this.stack.push(ctx); this.tab = 'ct'; await this.render(); },
  async back() { if (this.stack.length > 1) { this.stack.pop(); this.tab = 'ct'; await this.render(); } },
  close() {
    if (!this.el) return;
    this.el.remove(); this.el = null; document.body.classList.remove('modal-open');
    document.removeEventListener('keydown', this._key);
    window.scrollTo(0, this.scrollY);
    if (this.origin && document.body.contains(this.origin)) this.origin.focus({ preventScroll: true });
    this.origin = null; this.stack = [];
  },
  _key: e => { if (e.key === 'Escape') DetailModal.close(); },
  shell(inner) {
    if (!this.el) {
      this.el = document.createElement('div'); this.el.className = 'modal-bg';
      this.el.setAttribute('role', 'dialog'); this.el.setAttribute('aria-modal', 'true');
      this.el.onclick = e => { if (e.target === this.el) this.close(); };
      document.body.appendChild(this.el); document.body.classList.add('modal-open');
      document.addEventListener('keydown', this._key);
    }
    this.el.innerHTML = `<div class="modal">${inner}</div>`;
  },
  async render() {
    const ctx = this.stack[this.stack.length - 1], meta = App.meta, q = App.ctxQuery(ctx);
    this.shell(`<div class="modal-b loading"><span class="spinner"></span>Đang tải chi tiết…</div>`);
    let emps, details;
    try {
      const eq = { unit: q.unit, title: q.title, payGroup: q.payGroup, q: q.q, hrm: q.hrm };
      [emps, details] = await Promise.all([Api.employees(App.S.pid, eq), Api.details(App.S.pid, eq)]);
      Api.logView(`${q.hrm || q.unit || 'phạm vi'} | ${q.col || q.domain || 'tổng'}`);
    } catch (e) {
      this.shell(`<div class="modal-h"><div><h3>Không thể xem chi tiết</h3></div><button class="btn ghost x" data-x>${icon('x')}</button></div><div class="modal-b"><div class="note err">${U.esc(e.message)}</div></div>`);
      this.el.querySelector('[data-x]').onclick = () => this.close(); return;
    }
    const keys = Calc.measureCols(meta, q), amount = U.sum(emps, e => Calc.val(e, keys));
    const col = q.col ? Calc.col(meta, q.col) : null;
    const one = emps.length === 1 ? emps[0] : null;
    const uniqOr = (arr, lbl) => { const u = U.uniq(arr); return u.length === 1 ? u[0] : u.length ? `${u.length} ${lbl}` : '—'; };
    const natureTxt = q.nature === 'kk' ? 'Khuyến khích' : q.nature === 'luong' ? 'Lương đơn giá' : 'Tất cả';
    const title = ctx.label || (col ? col.label : q.domain ? DOMAINS[q.domain].name : 'Tổng thu nhập');
    const dr = Calc.detailRows(meta, details, q);
    const rec = Calc.recon(meta, emps, details, q);
    this.st = { emps, details, dr, rec, keys, amount, q, ctx, search: '', type: q.typeId || '', col: '', sort: 'desc', page: 0 };
    const tabs = [['ct', 'Chi tiết thuê bao'], ['hm', 'Theo hạng mục (Tổng hợp)']];
    if (emps.length > 1) tabs.push(['nv', `Theo nhân viên (${emps.length})`]);
    const excludedNote = col && !meta.formula.included[col.key] ? `<div class="note warn">Hạng mục <b>${U.esc(col.label)}</b> hiện <b>nằm ngoài công thức tổng thu nhập</b> (theo đối soát cột tổng của file) – số tiền vẫn hiển thị đúng như file nguồn.</div>` : '';
    this.shell(`
      <div class="modal-h">
        ${this.stack.length > 1 ? `<button class="btn sm" data-back title="Quay lại">${icon('back')} Quay lại</button>` : ''}
        <div style="min-width:0"><h3>Chi tiết: ${U.esc(title)}</h3><div class="sub">Kỳ lương ${U.esc(App.periodLabel())} · ${U.esc(App.filterSummary(q))}</div></div>
        <button class="btn ghost x" data-x aria-label="Đóng">${icon('x')}</button>
      </div>
      <div class="modal-b">
        <div class="info-grid">
          <div><label>Kỳ lương</label><span>${U.esc(App.periodLabel())}</span></div>
          ${one ? `<div><label>Mã HRM</label><span class="mono">${U.esc(one.hrm)}</span></div>` : `<div><label>Số lượng nhân sự</label><span>${U.int(emps.length)}</span></div>`}
          <div><label>Họ tên</label><span>${one ? U.esc(one.name) : '—'}</span></div>
          <div><label>Đơn vị</label><span>${U.esc(uniqOr(emps.map(e => e.unit), 'đơn vị'))}</span></div>
          <div><label>Chức danh</label><span>${U.esc(uniqOr(emps.map(e => e.title), 'chức danh'))}</span></div>
          <div><label>Mảng dịch vụ</label><span>${U.esc(q.domain ? DOMAINS[q.domain].name : col ? DOMAINS[col.domain].name : 'Tất cả mảng')}</span></div>
          <div><label>Hạng mục tiền · Tính chất</label><span>${U.esc(col ? col.label : 'Tất cả hạng mục')} · ${natureTxt}</span></div>
          <div><label>Tổng tiền theo Tổng hợp</label><span class="big">${U.money(amount)}</span></div>
        </div>
        ${excludedNote}
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" class="${this.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div data-pane></div>
        <div class="no-print" style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">
          <button class="btn sm" data-apply>${icon('sliders')} Áp dụng làm bộ lọc dashboard</button>
          <button class="btn sm" data-print>${icon('print')} In</button>
          <button class="btn sm primary" data-close>Đóng</button>
        </div>
      </div>`);
    const m = this.el;
    m.querySelector('[data-x]').onclick = m.querySelector('[data-close]').onclick = () => this.close();
    const bk = m.querySelector('[data-back]'); if (bk) bk.onclick = () => this.back();
    m.querySelector('[data-print]').onclick = () => window.print();
    m.querySelector('[data-apply]').onclick = () => {
      const F = App.S.filters;
      ['unit', 'title', 'payGroup', 'hrm', 'domain', 'col', 'nature', 'typeId'].forEach(k => { if (q[k] !== undefined) F[k] = q[k] || ''; });
      if (App.user.level === 2) F.unit = ''; if (App.user.level === 3) F.hrm = '';
      this.close(); App.renderFilters(); App.renderPage(); toast('Đã áp dụng ngữ cảnh popup làm bộ lọc.');
    };
    m.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { this.tab = b.dataset.tab; m.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b)); this.pane(); });
    m.querySelector('.modal').setAttribute('tabindex', '-1'); m.querySelector('.modal').focus();
    this.pane();
  },
  pane() {
    const p = this.el.querySelector('[data-pane]'), st = this.st, meta = App.meta;
    if (this.tab === 'hm') {
      const rows = Calc.leafBreakdown(meta, st.emps, st.q, true).filter(r => Math.abs(r.total) >= 0.005 || r.col.key === st.q.col);
      const tot = U.sum(rows.filter(r => r.included), r => r.total);
      p.innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mảng</th><th>Hạng mục</th><th>Tính chất</th><th class="num">Số tiền</th><th class="num">Tỷ trọng</th><th class="num">Số NS phát sinh</th></tr></thead><tbody>${rows.map(r => `<tr class="${r.included ? '' : 'excluded'}" ${r.included ? '' : 'title="Khoản không cộng vào tổng thu nhập"'}><td>${DOMAINS[r.col.domain].short}</td><td>${U.esc(r.col.label)}</td><td>${r.col.isKK ? '<span class="badge kk">KK</span>' : '<span class="badge info">Lương</span>'}</td><td class="num">${moneyBtn(r.total, { ...st.ctx, col: r.col.key, domain: '', label: r.col.label })}</td><td class="num">${r.included && tot ? U.pct(r.total / tot) : '—'}</td><td class="num">${r.nActive}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Tổng</td><td class="num">${U.money(tot)}</td><td></td><td></td></tr></tfoot></table></div>` : '<div class="note">Không có hạng mục nào phát sinh tiền trong ngữ cảnh này.</div>';
      return;
    }
    if (this.tab === 'nv') {
      p.innerHTML = '<div data-t></div>';
      new DataTable(p.querySelector('[data-t]'), {
        rows: st.emps.map(e => ({ ...e, amt: Calc.val(e, st.keys) })), sortKey: 'amt', pageSize: 10, search: false,
        columns: [{ key: '_stt', label: 'STT', sortable: false }, { key: 'hrm', label: 'Mã HRM', cls: 'mono' }, { key: 'name', label: 'Họ tên' }, { key: 'unit', label: 'Đơn vị' }, { key: 'title', label: 'Chức danh' },
          { key: 'amt', label: 'Số tiền', type: 'money', ctx: r => ({ ...st.ctx, hrm: r.hrm, unit: '', label: r.name }) }],
        footer: rows => ['', 'Tổng', '', '', '', U.money(U.sum(rows, r => r.amt))],
      });
      return;
    }
    // Tab chi tiết thuê bao
    if (!meta.detailTotal) {
      p.innerHTML = `<div class="note warn"><b>Không có mã thuê bao để hiển thị.</b> Sheet “Chi tiết” của kỳ ${U.esc(App.periodLabel())} chỉ có hàng tiêu đề (Mã HRM, Mã tb, ID tổng hợp, Tiền, ID loại tiền), không có dòng dữ liệu. Số tiền ở trên được lấy từ sheet “Tổng hợp”. Dashboard không tạo dữ liệu giả để thay thế.</div>`;
      return;
    }
    p.innerHTML = `
      ${st.dr.unmappedHidden ? `<div class="note warn">${st.dr.unmappedHidden} dòng chi tiết của phạm vi này chưa ánh xạ “ID tổng hợp” → hạng mục nên <b>không</b> được đưa vào hạng mục đang xem.</div>` : ''}
      ${st.dr.unmappedShown ? `<div class="note warn">${st.dr.unmappedShown} dòng chưa ánh xạ “ID tổng hợp” → hạng mục: vẫn hiển thị (vì đang xem toàn bộ) với nhãn “Chưa ánh xạ”.</div>` : ''}
      <div class="tbl-tools">
        <span class="grow"></span>
        <button class="btn sm" data-ex="csv">${icon('download')} CSV</button><button class="btn sm" data-ex="xlsx">${icon('download')} Excel</button>
      </div>
      <div data-rows></div><div data-sum></div>`;
    const rer = () => this.detailTable();
    p.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => this.exportRows(b.dataset.ex));
    rer();
  },
  currentRows() {
    const st = this.st; let rows = st.dr.rows;
    if (st.search) { const s = U.norm(st.search); rows = rows.filter(d => U.norm(d.sub).includes(s)); }
    if (st.type) rows = rows.filter(d => d.typeId === st.type);
    if (st.col) rows = rows.filter(d => (d.col || '__none') === st.col);
    rows = [...rows].sort((a, b) => st.sort === 'sub' ? a.sub.localeCompare(b.sub) : st.sort === 'asc' ? a.amount - b.amount : b.amount - a.amount);
    return rows;
  },
  detailTable() {
    const st = this.st, meta = App.meta, p = this.el.querySelector('[data-pane]');
    const rows = this.currentRows(), ps = 15, pages = Math.max(1, Math.ceil(rows.length / ps));
    if (st.page >= pages) st.page = pages - 1;
    const multi = st.emps.length > 1, names = Object.fromEntries(st.emps.map(e => [e.hrm, e.name]));
    const colName = d => d.col ? Calc.col(meta, d.col).label : `<span class="badge warn">Chưa ánh xạ</span>`;
    const typeName = d => d.typeName ? U.esc(d.typeName) : `<span class="badge err">Chưa ánh xạ (ID ${U.esc(d.typeId || 'trống')})</span>`;
    p.querySelector('[data-rows]').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>STT</th>${multi ? '<th>Mã HRM</th><th>Họ tên</th>' : ''}<th>Mã thuê bao</th><th>Loại tiền</th><th>Hạng mục</th><th class="num">Số tiền</th></tr></thead><tbody>${rows.slice(st.page * ps, st.page * ps + ps).map((d, i) => `<tr><td>${st.page * ps + i + 1}</td>${multi ? `<td class="mono">${U.esc(d.hrm)}</td><td>${U.esc(names[d.hrm] || '')}</td>` : ''}<td class="mono">${d.sub ? U.esc(d.sub) : '<span class="faint">—</span>'}</td><td>${typeName(d)}</td><td>${typeof colName(d) === 'string' && d.col ? U.esc(colName(d)) : colName(d)}</td><td class="num ${d.amount < 0 ? 'neg' : ''}">${U.money(d.amount)}</td></tr>`).join('')}</tbody></table></div>
      <div class="pager"><span>${rows.length} dòng</span>${pages > 1 ? `<button class="btn sm" data-p="${st.page - 1}" ${st.page === 0 ? 'disabled' : ''}>‹</button><span>Trang ${st.page + 1}/${pages}</span><button class="btn sm" data-p="${st.page + 1}" ${st.page >= pages - 1 ? 'disabled' : ''}>›</button>` : ''}</div>`
      : `<div class="note">Không có dòng chi tiết nào khớp ngữ cảnh hiện tại${meta.detailTotal ? ' (sheet Chi tiết có dữ liệu nhưng không có dòng thuộc phạm vi này).' : '.'}</div>`;
    p.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { st.page = +b.dataset.p; this.detailTable(); });
    const byType = {}, byCol = {};
    rows.forEach(d => { const t = d.typeName || `Chưa ánh xạ (ID ${d.typeId || 'trống'})`; byType[t] = (byType[t] || 0) + d.amount; const c = d.col ? Calc.col(meta, d.col).label : 'Chưa ánh xạ hạng mục'; byCol[c] = (byCol[c] || 0) + d.amount; });
    const box = (h, obj) => `<div class="sum-box"><h4>${h}</h4>${Object.entries(obj).map(([k, v]) => `<div class="row"><span>${U.esc(k)}</span><b class="num">${U.money(v)}</b></div>`).join('') || '<span class="muted">—</span>'}</div>`;
    p.querySelector('[data-sum]').innerHTML = `<div class="sum-grid">
