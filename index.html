<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard tiền lương – VNPT Hải Phòng</title>
<!--
  DASHBOARD THEO DÕI SẢN LƯỢNG & TIỀN LƯƠNG – VNPT HẢI PHÒNG
  Bản demo một file: không phụ thuộc thư viện ngoài, chạy được không cần Internet.
  CẢNH BÁO: bản demo – chưa đủ điều kiện sử dụng với dữ liệu lương thật (xem trang “Bảo mật & hướng dẫn”).
  File KHÔNG nhúng dữ liệu lương; dữ liệu chỉ được nạp từ file Excel do người dùng chọn.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* =====================================================================
 * GIAO DIỆN – phong cách Fabric + VNPT (xanh VNPT, trắng, cyan; cam nhấn tiền/cảnh báo)
 * ===================================================================== */
:root {
  --brand: #0A5CB8; --brand-700: #08488F; --brand-900: #062F5F; --brand-50: #EAF2FC; --brand-100: #D3E5F8;
  --cyan: #00A9E0; --cyan-50: #E5F7FD;
  --accent: #EF7D1A; --accent-50: #FFF3E6;
  --warn: #B7791F; --warn-50: #FFF8E1; --danger: #C93838; --danger-50: #FDECEC; --ok: #18875B; --ok-50: #E7F6EF;
  --bg: #F3F6FA; --surface: #FFFFFF; --surface-2: #F8FAFD; --line: #E1E8F0; --line-2: #CBD6E2;
  --text: #17293B; --muted: #5A6B7D; --faint: #8796A6;
  --radius: 10px; --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(16, 42, 75, .06), 0 1px 3px rgba(16, 42, 75, .05);
  --shadow-lg: 0 12px 40px rgba(6, 30, 60, .22);
  --font: 'Be Vietnam Pro', 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace;
  --side-w: 268px; --top-h: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
.hidden { display: none !important; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.neg { color: var(--danger); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }

/* ---------- Dải cảnh báo demo ---------- */
.demo-strip { background: #2A1B05; color: #FFE2B8; font-size: 12.5px; padding: 6px 16px; display: flex; gap: 10px; align-items: center; justify-content: center; text-align: center; }
.demo-strip b { color: #FFB45E; letter-spacing: .02em; }
.illus-strip { background: var(--accent); color: #fff; font-weight: 700; text-align: center; padding: 5px 12px; font-size: 12.5px; letter-spacing: .04em; }

/* ---------- Đăng nhập ---------- */
.login-wrap { min-height: calc(100vh - 32px); display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(1200px 500px at 85% -10%, rgba(0,169,224,.25), transparent 60%), linear-gradient(160deg, #062F5F 0%, #0A5CB8 55%, #0B74C9 100%); }
.login-card { width: 100%; max-width: 420px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 28px 28px 22px; }
.login-brand { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--brand), var(--cyan)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .02em; flex: none; }
.login-brand h1 { font-size: 15px; line-height: 1.3; margin: 0; color: var(--brand-900); }
.login-brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.input, .select { height: 36px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: #fff; min-width: 0; }
.input:focus, .select:focus, .btn:focus-visible, .money:focus-visible, .nav a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
textarea.input { height: auto; padding: 8px 10px; }
.btn { height: 36px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-700); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); border-color: #EBC3C3; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.login-err { color: var(--danger); background: var(--danger-50); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
.login-note { margin-top: 16px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--warn-50); border: 1px solid #F0DDAF; font-size: 12.5px; color: #5C4413; }
.login-note code { background: #fff; padding: 1px 5px; border-radius: 4px; font-family: var(--mono); }

/* ---------- Khung ứng dụng ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); grid-template-rows: var(--top-h) 1fr; min-height: calc(100vh - 32px); }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: linear-gradient(90deg, var(--brand-900), var(--brand)); color: #fff; position: sticky; top: 0; z-index: 30; }
.topbar .title { font-weight: 700; font-size: 14.5px; letter-spacing: .01em; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .title small { display: block; font-weight: 400; opacity: .8; font-size: 11.5px; }
.topbar .spacer { flex: 1; }
.topbar .chip { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.topbar .user { display: flex; align-items: center; gap: 8px; font-size: 12.5px; text-align: right; line-height: 1.25; }
.topbar .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-weight: 700; flex: none; }
.topbar .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.topbar .btn:hover { background: rgba(255,255,255,.12); }
.burger { display: none; }
.sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 12px 10px; position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h) - 32px); overflow-y: auto; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .sec { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; padding: 12px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text); text-decoration: none; font-weight: 500; }
.nav a svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--brand-50); color: var(--brand-700); font-weight: 700; box-shadow: inset 3px 0 0 var(--brand); }
.nav a.active svg { color: var(--brand); }
.main { min-width: 0; padding: 0 0 40px; }
.content { padding: 16px 20px; max-width: 1600px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 14px; }
.page-h h2 { margin: 0; font-size: 19px; color: var(--brand-900); }
.page-h p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

/* ---------- Thanh bộ lọc ---------- */
.filterbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; position: sticky; top: var(--top-h); z-index: 20; }
.filterbar .f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.filterbar .f label { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
.filterbar .select, .filterbar .input { height: 32px; font-size: 13px; max-width: 220px; }
.filterbar .f.wide .select { max-width: 280px; }
.filterbar .fixed { height: 32px; display: flex; align-items: center; padding: 0 10px; background: var(--brand-50); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; color: var(--brand-700); }
.filterbar .fcount { margin-left: auto; font-size: 12.5px; color: var(--muted); align-self: center; text-align: right; }
.filterbar .fcount b { color: var(--text); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius-sm); overflow: hidden; height: 32px; }
.seg button { border: 0; background: #fff; padding: 0 10px; font-size: 12.5px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--brand); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
.fchip { background: var(--cyan-50); color: #04617F; border: 1px solid #B9E7F6; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.fchip button { border: 0; background: none; cursor: pointer; color: inherit; padding: 0 0 0 4px; font-weight: 700; }

/* ---------- Thẻ, lưới ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px 0; flex-wrap: wrap; }
.card-h h3 { margin: 0; font-size: 14px; color: var(--brand-900); }
.card-h .sub { font-size: 12px; color: var(--muted); }
.card-b { padding: 12px 14px 14px; }
.grid { display: grid; gap: 14px; margin-bottom: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); position: relative; min-width: 0; }
.kpi .k-l { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.kpi .k-l svg { width: 15px; height: 15px; color: var(--brand); flex: none; }
.kpi .k-v { font-size: 22px; font-weight: 800; color: var(--brand-900); margin-top: 4px; letter-spacing: -.01em; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .k-v .money { font-size: inherit; font-weight: inherit; color: inherit; }
.kpi .k-s { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
.kpi.accent { border-top: 3px solid var(--accent); }
.kpi.accent .k-v { color: #B35A0A; }
.kpi.brand { border-top: 3px solid var(--brand); }
.kpi.cyan { border-top: 3px solid var(--cyan); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--ok-50); color: var(--ok); }
.badge.warn { background: var(--warn-50); color: var(--warn); }
.badge.err { background: var(--danger-50); color: var(--danger); }
.badge.info { background: var(--brand-50); color: var(--brand-700); }
.badge.kk { background: var(--accent-50); color: #A4520A; }
.badge.gray { background: #EEF2F6; color: var(--muted); }
.note { background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.note.warn { border-left-color: var(--warn); background: var(--warn-50); color: #5C4413; }
.note.err { border-left-color: var(--danger); background: var(--danger-50); color: #6E1F1F; }
.note.ok { border-left-color: var(--ok); background: var(--ok-50); color: #134B33; }
.note b { color: var(--text); }
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty h3 { color: var(--text); margin: 8px 0; }

/* ---------- Ô tiền bấm được ---------- */
.money { border: 0; background: none; padding: 0; cursor: pointer; color: var(--brand-700); font-variant-numeric: tabular-nums; text-decoration: underline dotted rgba(10,92,184,.45); text-underline-offset: 3px; font-weight: 600; text-align: right; }
.money:hover { color: var(--accent); text-decoration-color: var(--accent); }
.money.neg { color: var(--danger); }
.money.zero { color: var(--faint); font-weight: 400; }

/* ---------- Bảng ---------- */
.tbl-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.tbl-tools .input { height: 32px; max-width: 260px; }
.tbl-tools .grow { flex: 1; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { background: var(--surface-2); text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--brand); }
.tbl th .arr { opacity: .35; font-size: 10px; margin-left: 3px; }
.tbl th.sorted .arr { opacity: 1; color: var(--brand); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid #EEF2F6; vertical-align: top; }
.tbl tbody tr:hover td { background: #F7FAFE; }
.tbl tr.grp td { background: var(--brand-50); font-weight: 700; color: var(--brand-900); }
.tbl tr.excluded td { color: var(--faint); }
.tbl tfoot td { background: var(--surface-2); font-weight: 700; border-top: 2px solid var(--line); }
.tbl .rank { width: 34px; text-align: center; font-weight: 800; color: var(--brand); }
.tbl .clickrow { cursor: pointer; }
.pager { display: flex; gap: 6px; align-items: center; justify-content: flex-end; padding-top: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.mini-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #EEF2F6; min-width: 90px; }
.mini-bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---------- Biểu đồ SVG ---------- */
.chart { width: 100%; min-height: 120px; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .bar { cursor: pointer; transition: opacity .12s; }
.chart .bar:hover { opacity: .8; }
.chart text { font-family: var(--font); fill: var(--muted); font-size: 11px; }
.chart .axis { stroke: var(--line-2); }
.chart .gridl { stroke: #EEF2F6; }
.chart-empty { padding: 40px 10px; text-align: center; color: var(--faint); font-size: 13px; }
.tip { position: fixed; z-index: 200; pointer-events: none; background: #102A43; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 12px; box-shadow: var(--shadow-lg); max-width: 300px; line-height: 1.4; }
.donut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.donut-wrap .chart { width: 200px; flex: none; }
.donut-legend { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px; }
.donut-legend button { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; border: 0; background: none; text-align: left; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 12.5px; }
.donut-legend button:hover { background: var(--surface-2); }
.donut-legend i { width: 12px; height: 12px; border-radius: 3px; }

/* ---------- Popup ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(6, 25, 50, .5); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 3vh 12px; overflow-y: auto; }
.modal { background: var(--surface); width: 100%; max-width: 1100px; border-radius: 12px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; min-width: 0; }
.modal-h { display: flex; align-items: flex-start; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, var(--brand-50), #fff); border-radius: 12px 12px 0 0; }
.modal-h h3 { margin: 0; font-size: 16px; color: var(--brand-900); }
.modal-h .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.modal-h .x { margin-left: auto; }
.modal-b { padding: 14px 18px 18px; min-width: 0; }
.info-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; }
.info-grid div { min-width: 0; }
.info-grid label { display: block; font-size: 11px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.info-grid span { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.info-grid .big { font-size: 18px; color: #B35A0A; font-weight: 800; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--brand-700); border-bottom-color: var(--brand); }
.sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.sum-box { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; min-width: 0; }
.sum-box h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sum-box .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.sum-box .row span:first-child { min-width: 0; overflow-wrap: anywhere; }

.toast { position: fixed; right: 16px; bottom: 16px; z-index: 300; background: #102A43; color: #fff; padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow-lg); font-size: 13px; max-width: 380px; }
.toast.err { background: var(--danger); }
.loading { padding: 30px; text-align: center; color: var(--muted); }
.spinner { width: 22px; height: 22px; border: 3px solid var(--brand-100); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.drop { border: 2px dashed var(--line-2); border-radius: var(--radius); padding: 22px; text-align: center; background: var(--surface-2); }
.drop.over { border-color: var(--brand); background: var(--brand-50); }
.formrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.formrow .field { margin: 0; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px 16px; }
.checklist label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 3px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.prose { font-size: 13.5px; color: var(--text); max-width: 900px; }
.prose h3 { color: var(--brand-900); margin: 18px 0 6px; font-size: 15px; }
.prose li { margin: 3px 0; }
.prose code { background: var(--surface-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }

/* ---------- Responsive ---------- */
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-21, .g-12 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar { padding: 0 10px; gap: 8px; }
  .topbar > .logo { display: none; }
  .burger { display: inline-flex; }
  .sidebar { position: fixed; left: 0; top: calc(var(--top-h) + 32px); bottom: 0; height: auto; width: 260px; z-index: 40; transform: translateX(-105%); transition: transform .18s; box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

<body>
<div class="demo-strip" role="note"><b>BẢN DEMO</b> – chưa đủ điều kiện sử dụng với dữ liệu lương thật · Kiểm tra quyền đang thực hiện phía trình duyệt, chưa có backend bảo mật</div>
<div id="root"></div>
<noscript><p style="padding:20px">Cần bật JavaScript để sử dụng dashboard.</p></noscript>
<script>
/* =====================================================================
 * LỚP 0 – TIỆN ÍCH CHUNG, ĐỌC/GHI EXCEL, BĂM MẬT KHẨU
 * Không phụ thuộc thư viện ngoài (chạy được trong mạng nội bộ không Internet)
 * ===================================================================== */
'use strict';

/* ---------- 0.1 Tiện ích định dạng & xử lý chuỗi ---------- */
const U = {
  esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  /** Chuẩn hóa để so khớp: bỏ dấu, viết hoa, gộp khoảng trắng */
  norm(s) {
    return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/đ/g, 'd').replace(/Đ/g, 'D').toUpperCase().replace(/\s+/g, ' ').trim();
  },
  _nf: {},
  nf(dec) {
    return this._nf[dec] || (this._nf[dec] = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: dec, minimumFractionDigits: 0 }));
  },
  /** Tiền đầy đủ, giữ tối đa 2 chữ số thập phân */
  money(v, dec = 2) {
    if (v == null || !isFinite(v)) return '—';
    return this.nf(dec).format(Math.abs(v) < 0.005 ? 0 : v);
  },
  /** Tiền rút gọn cho thẻ KPI / trục biểu đồ */
  short(v) {
    if (v == null || !isFinite(v)) return '—';
    const a = Math.abs(v);
    if (a >= 1e9) return this.nf(2).format(v / 1e9) + ' tỷ';
    if (a >= 1e6) return this.nf(1).format(v / 1e6) + ' tr';
    if (a >= 1e3) return this.nf(0).format(v / 1e3) + ' n';
    return this.nf(0).format(v);
  },
  int(v) { return v == null || !isFinite(v) ? '—' : this.nf(0).format(v); },
  pct(v, dec = 1) { return v == null || !isFinite(v) ? '—' : this.nf(dec).format(v * 100) + '%'; },
  sum(arr, f = x => x) { let s = 0; for (const x of arr) s += +f(x) || 0; return s; },
  median(nums) {
    if (!nums.length) return null;
    const a = [...nums].sort((x, y) => x - y), m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  },
  uniq(arr) { return [...new Set(arr)]; },
  uid(n = 24) {
    const b = new Uint8Array(n);
    (globalThis.crypto && crypto.getRandomValues) ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.random() * 256);
    return [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  },
  slug(s) { return this.norm(s).replace(/[^A-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'NA'; },
  colToNum(s) { let n = 0; for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64; return n; },
  numToCol(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; },
  debounce(fn, ms = 250) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  nowStamp() {
    const d = new Date(), p = x => String(x).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  },
  dt(ts) { return ts ? new Date(ts).toLocaleString('vi-VN') : '—'; },
  download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  clone(o) { return JSON.parse(JSON.stringify(o)); },
};

/* ---------- 0.2 Đọc file .xlsx (ZIP + XML) bằng API có sẵn của trình duyệt ---------- */
const XlsxReader = {
  async inflateRaw(data) {
    if (typeof DecompressionStream === 'undefined')
      throw new Error('Trình duyệt không hỗ trợ giải nén file Excel (DecompressionStream). Vui lòng dùng Chrome/Edge/Firefox/Safari phiên bản mới.');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  },
  async unzip(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('File không đúng định dạng .xlsx (không đọc được cấu trúc nén). Lưu ý: định dạng .xls cũ không được hỗ trợ, hãy lưu lại thành .xlsx.');
    const n = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const files = {}, td = new TextDecoder('utf-8');
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Cấu trúc file .xlsx bị hỏng.');
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      files[td.decode(u8.subarray(p + 46, p + 46 + nlen))] = { method, csize, off };
      p += 46 + nlen + elen + clen;
    }
    const self = this;
    return {
      has: name => !!files[name],
      async text(name) {
        const f = files[name]; if (!f) return null;
        const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
        const data = u8.subarray(start, start + f.csize);
        const out = f.method === 0 ? data : f.method === 8 ? await self.inflateRaw(data) : null;
        if (!out) throw new Error('Phương thức nén không hỗ trợ trong ' + name);
        return td.decode(out);
      },
    };
  },
  xml(txt) {
    const d = new DOMParser().parseFromString(txt, 'application/xml');
    if (d.getElementsByTagName('parsererror').length) throw new Error('Không đọc được XML trong file Excel.');
    return d;
  },
  tags(el, name) { return [...el.getElementsByTagNameNS('*', name)]; },
  resolve(base, target) {
    if (target.startsWith('/')) return target.slice(1);
    const parts = base.split('/'); parts.pop();
    for (const seg of target.split('/')) { if (seg === '..') parts.pop(); else if (seg !== '.') parts.push(seg); }
    return parts.join('/');
  },
  /** Trả về workbook chuẩn: { sheetNames, sheet(name) → {maxR,maxC,get(r,c)} } – r,c bắt đầu từ 1 */
  async read(buf) {
    const z = await this.unzip(buf);
    const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    let wbPath = 'xl/workbook.xml';
    const rootRels = await z.text('_rels/.rels');
    if (rootRels) {
      const r = this.tags(this.xml(rootRels), 'Relationship').find(x => /officeDocument$/.test(x.getAttribute('Type')));
      if (r) wbPath = this.resolve('', r.getAttribute('Target'));
    }
    const wbXml = await z.text(wbPath);
    if (!wbXml) throw new Error('Không tìm thấy workbook trong file Excel.');
    const relsPath = wbPath.replace(/[^/]+$/, '_rels/') + wbPath.split('/').pop() + '.rels';
    const rels = {};
    const relXml = await z.text(relsPath);
    if (relXml) for (const r of this.tags(this.xml(relXml), 'Relationship')) rels[r.getAttribute('Id')] = this.resolve(wbPath, r.getAttribute('Target'));
    // Bảng chuỗi dùng chung
    const sst = [];
    const sstPath = Object.values(rels).find(t => /sharedStrings\.xml$/i.test(t)) || 'xl/sharedStrings.xml';
    const sstXml = await z.text(sstPath);
    if (sstXml) for (const si of this.tags(this.xml(sstXml), 'si'))
      sst.push(this.tags(si, 't').filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join(''));
    // Định dạng số (để giữ số 0 đầu mã nếu mã lưu dạng số có định dạng 000…)
    const xfFmt = [], fmtCode = {};
    const stPath = Object.values(rels).find(t => /styles\.xml$/i.test(t)) || 'xl/styles.xml';
    const stXml = await z.text(stPath);
    if (stXml) {
      const sd = this.xml(stXml);
      for (const f of this.tags(sd, 'numFmt')) fmtCode[f.getAttribute('numFmtId')] = f.getAttribute('formatCode');
      const cx = this.tags(sd, 'cellXfs')[0];
      if (cx) for (const xf of [...cx.children].filter(e => e.localName === 'xf')) xfFmt.push(fmtCode[xf.getAttribute('numFmtId')] || '');
    }
    const sheetsMeta = this.tags(this.xml(wbXml), 'sheet').map(s => ({
      name: s.getAttribute('name'),
      path: rels[s.getAttributeNS(RNS, 'id') || s.getAttribute('r:id')],
    }));
    const cache = {};
    const self = this;
    const loadSheet = async (meta) => {
      const txt = meta.path ? await z.text(meta.path) : null;
      const rows = {}; let maxR = 0, maxC = 0;
      if (txt) {
        const d = self.xml(txt);
        let rIdx = 0;
        for (const row of self.tags(d, 'row')) {
          rIdx = +row.getAttribute('r') || rIdx + 1;
          let cIdx = 0;
          for (const c of [...row.children].filter(e => e.localName === 'c')) {
            const ref = c.getAttribute('r');
            cIdx = ref ? U.colToNum(ref.replace(/\d+/g, '')) : cIdx + 1;
            const t = c.getAttribute('t') || 'n';
            const vEl = [...c.children].find(e => e.localName === 'v');
            const raw = vEl ? vEl.textContent : null;
            let cell = null;
            if (t === 's') { const s = sst[+raw] ?? ''; cell = { v: s, t: 's', text: s }; }
            else if (t === 'str') cell = { v: raw ?? '', t: 's', text: raw ?? '' };
            else if (t === 'inlineStr') { const s = self.tags(c, 't').map(x => x.textContent).join(''); cell = { v: s, t: 's', text: s }; }
            else if (t === 'b') cell = { v: raw === '1', t: 'b', text: raw === '1' ? 'TRUE' : 'FALSE' };
            else if (t === 'e') cell = { v: raw, t: 'e', text: raw };
            else if (raw != null && raw !== '') {
              const num = parseFloat(raw);
              const fmt = xfFmt[+c.getAttribute('s') || 0] || '';
              let text = Number.isInteger(num) ? num.toFixed(0) : String(num);
              if (/^0+$/.test(fmt) && Number.isInteger(num)) text = text.padStart(fmt.length, '0');
              cell = { v: num, t: 'n', text };
            }
            if (cell && !(cell.t === 's' && cell.v === '')) {
              (rows[rIdx] || (rows[rIdx] = {}))[cIdx] = cell;
              if (rIdx > maxR) maxR = rIdx; if (cIdx > maxC) maxC = cIdx;
            }
          }
        }
      }
      return { name: meta.name, maxR, maxC, get: (r, c) => (rows[r] && rows[r][c]) || null };
    };
    // Đọc toàn bộ sheet trước để API dùng đồng bộ
    for (const m of sheetsMeta) cache[m.name] = await loadSheet(m);

  },
  /** Tạo workbook chuẩn từ mảng 2 chiều (dùng cho dữ liệu minh họa) */
  fromAOA(sheets) {
    const cache = {};
    for (const [name, aoa] of Object.entries(sheets)) {
      let maxC = 0;
      aoa.forEach(r => { if (r && r.length > maxC) maxC = r.length; });
      cache[name] = {
        name, maxR: aoa.length, maxC,
        get(r, c) {
          const v = aoa[r - 1] ? aoa[r - 1][c - 1] : undefined;
          if (v == null || v === '') return null;
          return typeof v === 'number' ? { v, t: 'n', text: Number.isInteger(v) ? v.toFixed(0) : String(v) } : { v: String(v), t: 's', text: String(v) };
        },
      };
    }
    return { sheetNames: Object.keys(sheets), sheet: n => cache[n] || null };
  },
};

const XlsxWriter = {
  _crcT: null,
  crc32(u8) {

      lh.setUint16(8, 0, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true);
      parts.push(new Uint8Array(lh.buffer), name, f.data);

      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + size;
    }

    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);

      while (used.has(n)) n = (n.slice(0, 28) + '_' + i);

    });

      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>') });
    files.push({ name: '_rels/.rels', data: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') });

const Sha256 = (() => {

    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));

    const total = ((l + 9 + 63) >> 6) << 6, buf = new Uint8Array(total);
    buf.set(bytes); buf[l] = 0x80;

    }
