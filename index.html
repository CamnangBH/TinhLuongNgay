      ${box('Tổng tiền theo loại tiền', byType)}${box('Tổng tiền theo hạng mục', byCol)}</div>`;
  },
  reconBox() {
    const r = this.st.rec;
    if (r.status !== 'ok') return `<div class="note ${r.status === 'nodetail' ? 'warn' : 'warn'}" style="margin-top:12px"><b>Đối soát Tổng hợp ↔ Chi tiết:</b> ${U.esc(r.msg)}</div>`;
    const okv = Math.abs(r.diff) < 1;
    return `<div class="note ${okv ? 'ok' : 'err'}" style="margin-top:12px"><b>Đối soát Tổng hợp ↔ Chi tiết</b> (${U.esc(r.msg)}): Tổng hợp <b>${U.money(r.summary)}</b> · Chi tiết <b>${U.money(r.detail)}</b> · Chênh lệch (Tổng hợp − Chi tiết) <b>${U.money(r.diff)}</b> ${okv ? '<span class="badge ok">Khớp</span>' : '<span class="badge err">Lệch</span>'}<div class="small">Không áp dụng bộ lọc tìm kiếm/loại tiền/hạng mục trong popup.</div></div>`;
  },
  async exportRows(fmt) {
    const rows = this.currentRows(), st = this.st, meta = App.meta, names = Object.fromEntries(st.emps.map(e => [e.hrm, e]));
    const scope = st.q.hrm ? 'NV-' + st.q.hrm : st.q.unit ? 'DV-' + U.slug(st.q.unit) : App.scopeSlug();
    await Exporter.run('chitiet', fmt, 'ChiTietThueBao', scope, [{
      name: 'Chi tiết thuê bao', title: 'BẢNG CHI TIẾT MÃ THUÊ BAO VÀ LOẠI TIỀN', extra: [['Ngữ cảnh', App.filterSummary(st.q)]],
      header: ['STT', 'Mã HRM', 'Họ tên', 'Đơn vị', 'Mã thuê bao', 'Loại tiền', 'Hạng mục', 'Số tiền'],
      rows: rows.map((d, i) => [i + 1, d.hrm, names[d.hrm]?.name || '', names[d.hrm]?.unit || '', d.sub, d.typeName || 'Chưa ánh xạ', d.col ? Calc.col(meta, d.col).label : 'Chưa ánh xạ', d.amount]),
    }], { hrm: st.q.hrm });
  },
};

/* ---------------------------------------------------------------------
 * LỚP 8 – Exporter: CSV (UTF-8 BOM) / Excel (.xlsx) / In
 * Quyền xuất được “máy chủ” kiểm tra trước (Api.canExport).
 * ------------------------------------------------------------------- */
const Exporter = {
  fname(report, scope, ext) { return `VNPTHP_${report}_Ky-${U.slug(App.periodLabel())}_PV-${scope}_${U.nowStamp()}.${ext}`; },
  /** sheets: [{name, title, extra:[[k,v]], header:[], rows:[[]]}] */
  async run(type, fmt, report, scope, sheets, params = {}) {
    try { await Api.canExport(App.S.pid, type, params); }
    catch (e) { toast(e.message, true); return false; }
    const meta = App.meta;
    const head = s => [[s.title], ['Kỳ lương', App.periodLabel()], ['Phạm vi', App.scopeText()], ['Nguồn dữ liệu', meta.source === 'demo' ? 'DỮ LIỆU MINH HỌA – không phải số liệu thật' : meta.fileName],
      ['Công thức tổng thu nhập', meta.formula.confirmed ? 'Đã xác nhận bởi ' + meta.formula.confirmed.by : 'Đề xuất – CHƯA xác nhận'], ['Người xuất', App.user.hrm + ' – ' + App.user.name], ['Thời điểm xuất', new Date().toLocaleString('vi-VN')], ...(s.extra || []), []];
    if (fmt === 'csv') {
      const s = sheets[0], all = [...head(s), s.header, ...s.rows];
      const csv = all.map(r => r.map(v => v == null ? '' : typeof v === 'number' ? String(v) : /[",\n;]/.test(String(v)) || /^0\d/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v)).join(',')).join('\r\n');
      U.download(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), this.fname(report, scope, 'csv'));
    } else {
      U.download(XlsxWriter.build(sheets.map(s => {
        const h = head(s);
        return { name: s.name, rows: [...h, s.header, ...s.rows], boldRows: [0, h.length], widths: s.header.map((x, i) => i === 0 ? 8 : Math.min(48, Math.max(12, String(x).length + 4))) };
      })), this.fname(report, scope, 'xlsx'));
    }
    toast('Đã xuất ' + (fmt === 'csv' ? 'CSV' : 'Excel') + '.');
    return true;
  },
};

      <div class="f wide"><label>Hạng mục tiền</label><select class="select" data-f="col"><option value="">Tất cả (theo công thức)</option>${leaves.map(c => `<option value="${c.key}" ${F.col === c.key ? 'selected' : ''}>${U.esc(c.label)}${m.formula.included[c.key] ? '' : ' (ngoài tổng)'}</option>`).join('')}</select></div>
      <div class="f"><label>Tính chất</label><select class="select" data-f="nature"><option value="">Lương + KK</option><option value="luong" ${F.nature === 'luong' ? 'selected' : ''}>Chỉ lương</option><option value="kk" ${F.nature === 'kk' ? 'selected' : ''}>Chỉ khuyến khích</option></select></div>
      <div class="f"><label>Loại tiền (chi tiết)</label><select class="select" data-f="typeId"><option value="">Tất cả</option>${m.moneyTypes.map(t => `<option value="${U.esc(t.id)}" ${F.typeId === t.id ? 'selected' : ''}>${U.esc(t.name)}</option>`).join('')}</select></div>
      ${lv < 3 ? `<div class="f"><label>Tìm mã HRM / họ tên</label><input class="input" type="search" data-f="q" value="${U.esc(F.q)}" placeholder="Nhập để tìm…"></div>` : ''}
      ${lv < 3 ? `<div class="f"><label>Mẫu số bình quân</label><div class="seg" role="group"><button type="button" data-den="all" class="${this.S.denom === 'all' ? 'on' : ''}" title="Chia cho toàn bộ nhân sự trong phạm vi">Toàn bộ NS</button><button type="button" data-den="active" class="${this.S.denom === 'active' ? 'on' : ''}" title="Chỉ tính người có số tiền ≠ 0">NS có phát sinh</button></div></div>` : ''}
      <div class="f"><label>&nbsp;</label><button class="btn sm" data-clear style="height:32px">Xóa bộ lọc</button></div>
      <div class="fcount" id="fcount"></div>
      <div class="fb-summary" aria-live="polite"><span class="fb-ic">${icon('sliders')}</span><span class="fb-txt"><b>Kỳ: ${U.esc(this.periodLabel())}</b> · ${nAct ? `${nAct} bộ lọc: ${U.esc(this.filterSummary(F))}` : 'Không áp dụng bộ lọc'}</span></div>
      <button type="button" class="fb-toggle" data-fbt aria-expanded="${!this.S.fbMini}" title="${this.S.fbMini ? 'Mở bộ lọc' : 'Thu gọn bộ lọc để rộng màn hình'}"><span class="lbl-open">Mở bộ lọc${nAct ? ` <span class="fb-badge">${nAct}</span>` : ''}</span><span class="lbl-close">Thu gọn</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>`;
    fb.querySelector('[data-fbt]').onclick = () => {
      this.S.fbMini = !this.S.fbMini;
      try { localStorage.setItem('vnpthp.fb', this.S.fbMini ? 'mini' : 'full'); } catch { }
      fb.classList.add('anim'); fb.classList.toggle('mini', this.S.fbMini);
      const t = fb.querySelector('[data-fbt]'); t.setAttribute('aria-expanded', String(!this.S.fbMini)); t.title = this.S.fbMini ? 'Mở bộ lọc' : 'Thu gọn bộ lọc để rộng màn hình';
      setTimeout(() => fb.classList.remove('anim'), 300);
    };
    this.bindPeriod(fb);
    fb.querySelectorAll('[data-f]').forEach(el => {
      const h = () => { F[el.dataset.f] = el.value; if (el.dataset.f === 'domain' && F.col && Calc.col(m, F.col).domain !== el.value && el.value) F.col = ''; if (el.dataset.f === 'unit') F.hrm = ''; this.renderFilters(); this.renderPage(); };
      el.tagName === 'INPUT' ? el.oninput = U.debounce(h, 350) : el.onchange = h;
    });
    fb.querySelectorAll('[data-den]').forEach(b => b.onclick = () => { this.S.denom = b.dataset.den; this.renderFilters(); this.renderPage(); });
    fb.querySelector('[data-clear]').onclick = () => { this.S.filters = EMPTY_FILTERS(); this.renderFilters(); this.renderPage(); };
    const qi = fb.querySelector('[data-f="q"]'); if (qi && document.activeElement?.dataset?.f !== 'q' && F.q) { /* giữ nguyên */ }
  },
  periodSelect() {
    return `<div class="f"><label>Kỳ lương</label><select class="select" data-period>${this.periods.map(p => `<option value="${p.id}" ${p.id === this.S.pid ? 'selected' : ''}>${U.esc(p.period.label)}${p.source === 'demo' ? ' (minh họa)' : ''}</option>`).join('')}</select></div>`;
  },
  bindPeriod(fb) {
    const s = fb.querySelector('[data-period]');
    if (s) s.onchange = async () => { await this.selectPeriod(s.value); this.renderFilters(); this.renderPage(); };
  },
  setCount(nEmp, nDet) {
    const el = document.getElementById('fcount');
    if (el && this.S.route === 'overview') { el.innerHTML = ''; return; }
    if (el) el.innerHTML = `Đang phân tích: <b>${U.int(nEmp)}</b> nhân sự${nDet != null ? ` · <b>${U.int(nDet)}</b> dòng chi tiết` : ''}`;
  },
  chips() {
    const F = this.S.filters, items = [];
    const nm = { unit: 'Đơn vị', title: 'Chức danh', payGroup: 'Nhóm lương', domain: 'Mảng', col: 'Hạng mục', nature: 'Tính chất', typeId: 'Loại tiền', q: 'Tìm', hrm: 'Nhân viên' };
    for (const k in nm) if (F[k]) {
      let v = F[k];
      if (k === 'domain') v = DOMAINS[v].short; if (k === 'col') v = Calc.col(this.meta, v)?.label || v; if (k === 'nature') v = v === 'kk' ? 'Chỉ khuyến khích' : 'Chỉ lương';
      if (k === 'typeId') v = this.meta.moneyTypes.find(t => t.id === v)?.name || v;
      items.push(`<span class="fchip">${nm[k]}: <b>${U.esc(v)}</b><button data-rm="${k}" aria-label="Bỏ lọc ${nm[k]}">×</button></span>`);
    }
    items.push(`<span class="fchip">Bình quân: <b>${this.S.denom === 'all' ? 'chia toàn bộ nhân sự' : 'chia nhân sự có phát sinh'}</b></span>`);
    return `<div class="chips" data-chips>${items.join('')}</div>`;
  },
  bindChips(el) {
    el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { this.S.filters[b.dataset.rm] = ''; this.renderFilters(); this.renderPage(); });
  },

  /* ---------------- Điều phối trang ---------------- */
  _seq: 0,
  async renderPage() {
    const el = document.getElementById('page'); if (!el) return;
    const seq = ++this._seq, r = this.S.route;
    el.innerHTML = `<div class="loading"><span class="spinner"></span>Đang tải…</div>`;
    try {
      if (!this.meta && !['data', 'accounts', 'security'].includes(r)) { el.innerHTML = this.noData(); return; }
      const html = await Pages[r](el);
      if (seq !== this._seq) return;
      if (typeof html === 'string') el.innerHTML = html;
      this.bindChips(el);
      Charts.cleanup();
    } catch (e) {
      if (seq !== this._seq) return;
      console.error(e);
      el.innerHTML = `<div class="note err"><b>Lỗi:</b> ${U.esc(e.message)}</div>`;
    }
  },
  noData() {
    return `<div class="card"><div class="empty">${icon('upload', '')}<h3>Chưa có dữ liệu kỳ lương</h3><p>${this.user.level === 1 ? 'Vào trang <a href="#/data">Dữ liệu & kỳ lương</a> để tải file Excel hoặc nạp dữ liệu minh họa.' : 'Quản trị chưa tải dữ liệu kỳ lương nào. Vui lòng liên hệ quản trị.'}</p></div></div>`;
  },
  async fetchScope(withDetails = false) {
    const pid = this.S.pid, q = this.eq();
    const [emps, details] = await Promise.all([Api.employees(pid, q), withDetails ? Api.details(pid, q) : Promise.resolve(null)]);
    this.setCount(emps.length, details ? Calc.detailRows(this.meta, details, this.mf()).rows.length : null);
    return { emps, details };
  },
  changePwDialog() {
    DetailModal.shell(`<div class="modal-h"><div><h3>Đổi mật khẩu</h3><div class="sub">${U.esc(this.user.hrm)}</div></div><button class="btn ghost x" data-x>${icon('x')}</button></div>
      <form class="modal-b" id="pwF" style="max-width:420px"><div class="field"><label>Mật khẩu hiện tại</label><input class="input" type="password" name="o" required></div>
      <div class="field"><label>Mật khẩu mới (tối thiểu 6 ký tự)</label><input class="input" type="password" name="n" required minlength="6"></div>
      <button class="btn primary">Lưu</button></form>`);
    DetailModal.el.querySelector('[data-x]').onclick = () => DetailModal.close();
    document.getElementById('pwF').onsubmit = async e => {
      e.preventDefault(); const f = e.target;
      try { await Api.changePassword(f.o.value, f.n.value); DetailModal.close(); toast('Đã đổi mật khẩu.'); } catch (err) { toast(err.message, true); }
    };
  },
};

/* =====================================================================
 * CÁC TRANG
 * ===================================================================== */
const kpi = (cls, ic, label, value, sub) => `<div class="kpi ${cls}"><div class="k-l">${icon(ic)}${label}</div><div class="k-v">${value}</div>${sub ? `<div class="k-s">${sub}</div>` : ''}</div>`;
const card = (title, body, sub = '', extra = '') => `<div class="card"><div class="card-h"><div><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${extra}</div><div class="card-b">${body}</div></div>`;
const pageHead = (t, d, right = '') => `<div class="page-h"><div><h2>${t}</h2>${d ? `<p>${d}</p>` : ''}</div><div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap">${right}</div></div>`;
const domColors = ds => ds.map(d => DOMAINS[d.d].color);
const miniBar = (dom, total) => {
  const pos = DOMAIN_ORDER.map(d => [d, Math.max(0, dom[d] || 0)]).filter(x => x[1] > 0), t = U.sum(pos, x => x[1]);
  return `<div class="mini-bar" title="${U.esc(pos.map(([d, v]) => DOMAINS[d].short + ': ' + U.pct(v / t)).join(' · '))}">${pos.map(([d, v]) => `<span style="width:${v / t * 100}%;background:${DOMAINS[d].color}"></span>`).join('')}</div>`;
};
const domLegend = () => `<div class="legend">${DOMAIN_ORDER.slice(0, 5).map(d => `<span><i style="background:${DOMAINS[d].color}"></i>${DOMAINS[d].short}</span>`).join('')}</div>`;
const pickTitle = (emps, cur) => {
  if (cur) return cur;
  const cnt = {}; emps.forEach(e => cnt[e.title] = (cnt[e.title] || 0) + 1);
  return Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
};

const Pages = {
  /* ---------- TỔNG QUAN ĐIỀU HÀNH ---------- */
  async overview(el) {
    const m = App.meta, f = App.mf(), { emps, details } = await App.fetchScope(true);
    const k = Calc.kpis(m, emps, f, App.S.denom);
    const rec = Calc.recon(m, emps, details, f);
    const subs = U.uniq(Calc.detailRows(m, details, f).rows.map(d => d.sub)).length;
    const den = App.S.denom === 'all' ? `chia toàn bộ ${k.nAll} NS` : `chia ${k.nActive} NS có phát sinh`;
    const dom = Calc.domainBreakdown(m, emps, f).filter(d => d.keys.length || Math.abs(d.total) > 0);
    const leaves = Calc.leafBreakdown(m, emps, f).filter(r => Math.abs(r.total) >= 0.005).sort((a, b) => b.total - a.total);
    const units = App.user.level < 3 ? Calc.groupStats(m, emps, f, App.S.denom, e => e.unit).sort((a, b) => b.total - a.total) : [];
    el.innerHTML = `
      ${pageHead('Tổng quan điều hành', `Kỳ lương <b>${U.esc(App.periodLabel())}</b> · Phạm vi: ${U.esc(App.scopeText())}`, `<button class="btn sm" onclick="window.print()">${icon('print')} In / PDF</button>`)}
      ${App.chips()}
      <div class="kpis k3">
        ${kpi('brand', 'money', 'Tổng tiền lương đơn giá', moneyBtn(k.luong, { nature: 'luong', label: 'Tổng tiền lương đơn giá' }))}
        ${kpi('accent', 'gift', 'Tổng tiền khuyến khích', moneyBtn(k.kk, { nature: 'kk', label: 'Tổng tiền khuyến khích' }), `Tỷ trọng ${U.pct(k.total ? k.kk / k.total : null)} trên tổng`)}
        ${kpi('brand', 'sum', 'Tổng thu nhập', moneyBtn(k.total, { label: 'Tổng thu nhập' }))}
        ${kpi('cyan', 'users', 'Số người lao động', U.int(k.nAll))}
        ${kpi('cyan', 'avg', 'Thu nhập bình quân/người', U.money(k.avg, 0), `Tổng ÷ ${den}`)}
        ${kpi('cyan', 'med', 'Thu nhập trung vị/người', U.money(k.median, 0))}
      </div>
      <div class="grid g-21">
        ${card('Tổng tiền theo mảng dịch vụ', '<div class="chart" id="chDom"></div>', 'Bấm vào cột để xem chi tiết phát sinh')}
        ${card('Tỷ trọng các mảng trong tổng tiền', '<div id="chDonut"></div>')}
      </div>
      <div class="grid g2">
        ${card('Cơ cấu tiền lương và tiền khuyến khích theo mảng', '<div class="chart" id="chMix"></div>', '<span class="legend"><span><i style="background:#0B5CAD"></i>Lương</span><span><i style="background:#EF7D1A"></i>Khuyến khích</span></span>')}
        ${card('So sánh tiền theo từng hạng mục', '<div class="chart" id="chLeaf"></div>', `${leaves.length} hạng mục có phát sinh · bấm thanh để xem chi tiết`)}
      </div>
      ${App.user.level < 3 ? card(App.user.level === 1 ? 'Tổng hợp theo đơn vị' : 'Tổng hợp đơn vị', '<div id="tbUnits"></div>', 'Bấm số tiền để xem chi tiết của đơn vị') : ''}`;
    Charts.mount(el.querySelector('#chDom'), 'bar', { labels: dom.map(d => d.short), series: [{ name: 'Tổng tiền', color: '#0B5CAD', values: dom.map(d => d.total) }], colorsByIndex: domColors(dom), onClick: i => DetailModal.open({ domain: dom[i].d, label: dom[i].name }), aria: 'Tổng tiền theo mảng dịch vụ' });
    Charts.mount(el.querySelector('#chDonut'), 'donut', { labels: dom.map(d => d.short), values: dom.map(d => d.total), colors: domColors(dom), onClick: i => DetailModal.open({ domain: dom[i].d, label: dom[i].name }) });
    Charts.mount(el.querySelector('#chMix'), 'bar', { labels: dom.map(d => d.short), stacked: true, series: [{ name: 'Lương', color: '#0B5CAD', values: dom.map(d => d.luong) }, { name: 'Khuyến khích', color: '#EF7D1A', values: dom.map(d => d.kk) }], onClick: (i, s) => DetailModal.open({ domain: dom[i].d, nature: s ? 'kk' : 'luong', label: dom[i].short + (s ? ' – khuyến khích' : ' – lương') }) });
    Charts.mount(el.querySelector('#chLeaf'), 'bar', { horizontal: true, labels: leaves.map(r => r.col.label), series: [{ name: 'Số tiền', color: '#1AA6DE', values: leaves.map(r => r.total) }], colorsByIndex: leaves.map(r => DOMAINS[r.col.domain].color), onClick: i => DetailModal.open({ col: leaves[i].col.key, label: leaves[i].col.label }) });
    if (units.length) new DataTable(el.querySelector('#tbUnits'), {
      rows: units, sortKey: 'total', search: units.length > 6, pageSize: 20, searchPlaceholder: 'Tìm đơn vị…',
      columns: [{ key: 'key', label: 'Đơn vị' }, { key: 'nAll', label: 'Số NS', type: 'num' }, { key: 'n', label: 'NS tính BQ', type: 'num' },
        { key: 'total', label: 'Tổng thu nhập', type: 'money', ctx: r => ({ unit: r.key, label: r.key }) },
        { key: 'kk', label: 'Khuyến khích', type: 'money', ctx: r => ({ unit: r.key, nature: 'kk', label: r.key + ' – khuyến khích' }) },
        { key: 'avg', label: 'Bình quân/người', type: 'num', render: r => U.money(r.avg, 0) }, { key: 'median', label: 'Trung vị', type: 'num', render: r => U.money(r.median, 0) },
        { key: 'mix', label: 'Cơ cấu theo mảng', sortable: false, render: r => miniBar(r.dom, r.total) }],
      footer: rows => ['Tổng phạm vi', U.int(U.sum(rows, r => r.nAll)), U.int(U.sum(rows, r => r.n)), U.money(U.sum(rows, r => r.total)), U.money(U.sum(rows, r => r.kk)), U.money(U.sum(rows, r => r.total) / (U.sum(rows, r => r.n) || 1), 0), '', domLegend()],
    });
  },

  /* ---------- CƠ CẤU THEO MẢNG DỊCH VỤ ---------- */
  async structure(el) {
    const m = App.meta, F = App.S.filters, f = App.mf(), lv = App.user.level;
    const view = F.hrm ? 'nv' : (F.unit || lv === 2) ? 'dv' : 'vt';
    const all = await Api.employees(App.S.pid, { unit: lv === 2 ? '' : F.unit });
    const { emps } = await App.fetchScope(false);
    const dom = Calc.domainBreakdown(m, emps, f);
    const rows = Calc.leafBreakdown(m, emps, f, true);
    const tot = U.sum(rows.filter(r => r.included), r => r.total);
    const viewSel = `<div class="formrow no-print" style="margin-bottom:12px"><div class="field"><label>Góc nhìn</label><div class="seg">
      ${lv === 1 ? `<button data-v="vt" class="${view === 'vt' ? 'on' : ''}">Toàn Viễn thông</button>` : ''}<button data-v="dv" class="${view === 'dv' ? 'on' : ''}">Đơn vị</button><button data-v="nv" class="${view === 'nv' ? 'on' : ''}">Cá nhân</button></div></div>
      ${view === 'dv' && lv === 1 ? `<div class="field"><label>Chọn đơn vị</label><select class="select" data-unit><option value="">— Chọn —</option>${m.units.map(u => `<option ${u === F.unit ? 'selected' : ''}>${U.esc(u)}</option>`).join('')}</select></div>` : ''}
      ${view === 'nv' ? `<div class="field"><label>Chọn nhân viên</label><select class="select" data-hrm style="max-width:360px"><option value="">— Chọn —</option>${all.sort((a, b) => a.name.localeCompare(b.name, 'vi')).map(e => `<option value="${U.esc(e.hrm)}" ${e.hrm === F.hrm ? 'selected' : ''}>${U.esc(e.name)} · ${U.esc(e.hrm)}</option>`).join('')}</select></div>` : ''}</div>`;
    let tb = '';
    for (const d of DOMAIN_ORDER) {
      const rs = rows.filter(r => r.col.domain === d); if (!rs.length) continue;
      const dd = dom.find(x => x.d === d) || { total: 0, nActive: 0 };
      const grps = m.groups.filter(g => g.domain === d && g.totalCol);
      const chk = !f.col && !f.nature && grps.length ? grps.map(g => {
        const fileV = U.sum(emps, e => e.values[g.totalCol]), inc = U.sum(emps, e => Calc.val(e, g.cols.filter(k => m.formula.included[k])));
        return Math.abs(fileV - inc) < 1 ? `<span class="badge ok" title="Cột ${g.totalCol}: ${U.money(fileV)}">Khớp cột ${g.totalCol}</span>` : `<span class="badge err" title="Cột ${g.totalCol}: ${U.money(fileV)}">Lệch ${U.money(fileV - inc)} so với cột ${g.totalCol}</span>`;
      }).join(' ') : '<span class="faint">—</span>';
      tb += `<tr class="grp"><td>${DOMAINS[d].name}</td><td></td><td class="num">${moneyBtn(dd.total, { domain: d, label: DOMAINS[d].name })}</td><td class="num">${tot ? U.pct(dd.total / tot) : '—'}</td><td class="num">${dd.nActive}</td></tr>`;
      tb += rs.map(r => `<tr class="${r.included ? '' : 'excluded'}" ${r.included ? '' : 'title="Khoản không cộng vào tổng thu nhập"'}><td style="padding-left:24px">${U.esc(r.col.sub)}</td><td>${r.col.isKK ? '<span class="badge kk">KK</span>' : '<span class="badge info">Lương</span>'}${r.col.isAdj ? ' <span class="badge gray">Điều chỉnh</span>' : ''}</td><td class="num">${moneyBtn(r.total, { col: r.col.key, domain: '', label: r.col.label })}</td><td class="num">${r.included && tot ? U.pct(r.total / tot) : '—'}</td><td class="num">${r.nActive}</td></tr>`).join('');
    }
    el.innerHTML = `${pageHead('Cơ cấu tiền lương theo mảng dịch vụ', '')}
      ${App.chips()}${viewSel}
      ${view === 'dv' && !F.unit && lv === 1 ? '<div class="note">Chọn một đơn vị để xem cơ cấu của đơn vị đó.</div>' : ''}
      ${view === 'nv' && !F.hrm ? '<div class="note">Chọn một nhân viên để xem cơ cấu cá nhân.</div>' : ''}
      <div class="grid g3">
        ${card('Tổng tiền theo mảng', '<div class="chart" id="sDom"></div>')}
        ${card('Tỷ trọng mảng', '<div id="sDonut"></div>')}
        ${card('Lương và khuyến khích', '<div class="chart" id="sMix"></div>', '<span class="legend"><span><i style="background:#0B5CAD"></i>Lương</span><span><i style="background:#EF7D1A"></i>KK</span></span>')}
      </div>

      el.innerHTML = `${pageHead('So sánh nhân viên cùng chức danh', `Trong đơn vị <b>${U.esc(App.user.unit)}</b> · chỉ so sánh người có cùng chức danh`)}${App.chips()}${ctrl}${disclaimer}

        ${card('Thu nhập theo nhân viên', '<div class="chart" id="cmpCh"></div>', 'Đường cam: bình quân của chức danh trong đơn vị')}
        <div style="height:14px"></div>${card('Bảng so sánh', '<div id="cmpTb"></div>')}`;

      new DataTable(el.querySelector('#cmpTb'), { rows, sortKey: 'v', sortDir: C.dir, pageSize: 25, columns: [

    const pooledN = U.sum(groups, g => g.n), pooled = pooledN ? U.sum(groups, g => g.total) / pooledN : null;
    groups.forEach(g => { g.diff = g.avg == null || pooled == null ? null : g.avg - pooled; g.diffPct = g.diff != null && pooled ? g.diff / pooled : null; });

      ${card(C.metric === 'total' ? 'Tổng thu nhập theo đơn vị' : 'Thu nhập bình quân/người theo đơn vị', '<div class="chart" id="cmpCh"></div>', `Đường cam: bình quân chung của các đơn vị = Tổng thu nhập ÷ Tổng số NS tính BQ (không lấy bình quân của các bình quân)`)}
      <div style="height:14px"></div>
      ${card('Bảng so sánh', '<div id="cmpTb"></div>', 'Bấm tên đơn vị để xem danh sách người lao động cùng chức danh')}
      <div id="cmpOpen" style="margin-top:14px"></div>`;
    bindCtrl();
    Charts.mount(el.querySelector('#cmpCh'), 'bar', { labels: groups.map(g => g.key), series: [{ name: C.metric === 'total' ? 'Tổng thu nhập' : 'Bình quân/người', color: '#0B5CAD', values: groups.map(g => g[metric] || 0) }], refLine: metric === 'avg' && pooled != null ? { value: pooled, label: 'BQ chung' } : null, onClick: i => DetailModal.open({ unit: groups[i].key, title, label: groups[i].key + ' – ' + title }) });
    new DataTable(el.querySelector('#cmpTb'), { rows: groups, sortKey: metric, sortDir: C.dir, search: false, pageSize: 50, columns: [
      { key: 'key', label: 'Đơn vị', render: r => `<a href="javascript:void 0" data-open="${U.esc(r.key)}">${U.esc(r.key)}</a>` },
      { key: 'nAll', label: 'Số nhân sự', type: 'num', title: 'Số NS có chức danh này trong đơn vị' }, { key: 'n', label: 'NS tính BQ', type: 'num' },
      { key: 'total', label: 'Tổng thu nhập', type: 'money', ctx: r => ({ unit: r.key, title, label: r.key + ' – ' + title }) },
      { key: 'avg', label: 'Bình quân/người', type: 'num', render: r => U.money(r.avg, 0) }, { key: 'median', label: 'Trung vị', type: 'num', render: r => U.money(r.median, 0) },
      { key: 'max', label: 'Cao nhất', type: 'num', render: r => U.money(r.max, 0) }, { key: 'min', label: 'Thấp nhất', type: 'num', render: r => `<span class="${r.min < 0 ? 'neg' : ''}">${U.money(r.min, 0)}</span>` },
      { key: 'diff', label: 'Chênh lệch BQ so với BQ chung', type: 'num', render: r => r.diff == null ? '—' : `<span class="${r.diff < 0 ? 'neg' : ''}">${U.money(r.diff, 0)} (${U.pct(r.diffPct)})</span>` }],
      footer: rows => ['Chung các đơn vị', U.int(U.sum(rows, r => r.nAll)), U.int(pooledN), U.money(U.sum(rows, r => r.total)), U.money(pooled, 0), '', '', '', ''],
      onRender: t => t.el.querySelectorAll('[data-open]').forEach(a => a.onclick = () => { C.open = a.dataset.open; openList(); }) });
    const openList = () => {
      const g = groups.find(x => x.key === C.open), box = el.querySelector('#cmpOpen');

        { key: 'v', label: 'Thu nhập', type: 'money', ctx: r => ({ hrm: r.hrm, label: r.name }) },
        { key: 'd', label: 'Chênh lệch so với BQ đơn vị', type: 'num', value: r => g.avg == null ? null : r.v - g.avg, render: r => `<span class="${r.v - g.avg < 0 ? 'neg' : ''}">${U.money(r.v - g.avg, 0)}</span>` }],

  /* ---------- XẾP HẠNG TOP 5 ---------- */
  async ranking(el) {
    const m = App.meta, F = App.S.filters, f = App.mf(), lv = App.user.level;
    const { emps, details } = await App.fetchScope(true);
    const keys = Calc.measureCols(m, f);
    const subsBy = {}; Calc.detailRows(m, details, f).rows.forEach(d => (subsBy[d.hrm] || (subsBy[d.hrm] = new Set())).add(d.sub));
    let html = pageHead('Xếp hạng Top 5', '') + App.chips();
    const unitTbl = (rows, id) => `<div class="tbl-wrap"><table class="tbl" id="${id}"><thead><tr><th>#</th><th>Đơn vị</th><th class="num">Số NS tính</th><th class="num">Tổng thu nhập</th><th class="num">Bình quân</th><th class="num">Trung vị</th><th class="num">Chênh lệch so với BQ toàn phạm vi</th><th>Cơ cấu theo mảng</th></tr></thead><tbody>${rows.map((g, i) => `<tr><td class="rank">${i + 1}</td><td><a href="javascript:void 0" data-unit="${U.esc(g.key)}">${U.esc(g.key)}</a></td><td class="num">${g.n}/${g.nAll}</td><td class="num">${moneyBtn(g.total, { unit: g.key, label: g.key })}</td><td class="num">${U.money(g.avg, 0)}</td><td class="num">${U.money(g.median, 0)}</td><td class="num ${g.diff < 0 ? 'neg' : ''}">${U.money(g.diff, 0)} (${U.pct(g.diffPct)})</td><td>${miniBar(g.dom, g.total)}</td></tr>`).join('')}</tbody></table></div>`;
    if (lv === 1) {
      const groups = Calc.groupStats(m, emps, f, App.S.denom, e => e.unit).filter(g => g.n > 0);
      const pN = U.sum(groups, g => g.n), pooled = pN ? U.sum(groups, g => g.total) / pN : null;
      groups.forEach(g => { g.diff = g.avg - pooled; g.diffPct = pooled ? g.diff / pooled : null; });
      const hi = [...groups].sort((a, b) => b.avg - a.avg).slice(0, 5), lo = [...groups].sort((a, b) => a.avg - b.avg).slice(0, 5);
      html += `<div style="margin-bottom:10px">${domLegend()}</div>
        <div class="grid g2">${card('Top 5 đơn vị thu nhập bình quân cao nhất', unitTbl(hi, 'tHi'))}${card('Top 5 đơn vị thu nhập bình quân thấp nhất', unitTbl(lo, 'tLo'))}</div>`;
    }
    const title = F.title || (m.titles.includes(App.S.rankTitle) ? App.S.rankTitle : pickTitle(emps, ''));
    App.S.rankTitle = title;
    let te = emps.filter(e => e.title === title).map(e => {
      const v = Calc.val(e, keys), kk = Calc.val(e, keys.filter(k => Calc.col(m, k).isKK)), dom = {};
      DOMAIN_ORDER.forEach(d => dom[d] = Calc.val(e, keys.filter(k => Calc.col(m, k).domain === d)));
      return { ...e, v, kkp: v ? kk / v : null, dom, tb: subsBy[e.hrm] ? subsBy[e.hrm].size : 0 };
    });
    if (App.S.denom === 'active') te = te.filter(e => Math.abs(e.v) >= .005);
    const doms = DOMAIN_ORDER.filter(d => keys.some(k => Calc.col(m, k).domain === d));
    const staffTbl = rows => `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Mã HRM</th><th>Họ tên</th><th>Đơn vị</th><th>Chức danh</th><th class="num">Tổng thu nhập</th>${doms.map(d => `<th class="num">${DOMAINS[d].short}</th>`).join('')}<th class="num">% KK</th><th class="num">Số TB</th></tr></thead><tbody>${rows.map((r, i) => `<tr><td class="rank">${i + 1}</td><td class="mono">${U.esc(r.hrm)}</td><td><a href="#/profile" data-prof="${U.esc(r.hrm)}">${U.esc(r.name)}</a></td><td>${U.esc(r.unit)}</td><td class="small">${U.esc(r.title)}</td><td class="num">${moneyBtn(r.v, { hrm: r.hrm, label: r.name })}</td>${doms.map(d => `<td class="num">${moneyBtn(r.dom[d], { hrm: r.hrm, domain: d, label: r.name + ' – ' + DOMAINS[d].short })}</td>`).join('')}<td class="num">${U.pct(r.kkp)}</td><td class="num">${m.detailTotal ? r.tb : '—'}</td></tr>`).join('') || `<tr><td colspan="${8 + doms.length}" class="muted">Không có nhân sự.</td></tr>`}</tbody></table></div>`;
    const hiS = [...te].sort((a, b) => b.v - a.v).slice(0, 5), loS = [...te].sort((a, b) => a.v - b.v).slice(0, 5);
    html += `<div style="height:6px"></div>${card(`Top 5 nhân viên theo chức danh${lv === 2 ? ' – trong đơn vị' : ''}`, `
      <div class="formrow no-print" style="margin-bottom:10px"><div class="field"><label>Chức danh (từ dữ liệu thực tế)</label><select class="select" data-rt ${F.title ? 'disabled' : ''} style="max-width:420px">${m.titles.map(t => `<option ${t === title ? 'selected' : ''}>${U.esc(t)}</option>`).join('')}</select></div><div class="small muted">${te.length} nhân sự có chức danh này${App.S.denom === 'active' ? ' (đã loại người = 0 do chọn mẫu số “có phát sinh”)' : ''}. Mỗi chức danh xếp hạng riêng.</div></div>
      ${te.length < 10 ? `<div class="note">Chức danh có ${te.length} người (< 10) nên hai danh sách cao nhất/thấp nhất có thể trùng người.</div>` : ''}
      <h4 style="margin:6px 0">Thu nhập cao nhất</h4>${staffTbl(hiS)}
      <h4 style="margin:14px 0 6px">Thu nhập thấp nhất</h4>${staffTbl(loS)}`)}`;
    el.innerHTML = html;
    const rt = el.querySelector('[data-rt]'); if (rt) rt.onchange = () => { App.S.rankTitle = rt.value; App.renderPage(); };
    el.querySelectorAll('[data-unit]').forEach(a => a.onclick = () => { App.S.filters.unit = a.dataset.unit; App.S.filters.hrm = ''; App.go('structure'); });
    Pages._bindProfileLinks(el);
  },

  /* ---------- DỮ LIỆU & KỲ LƯƠNG (cấp 1) ---------- */
  async data(el) {
    el.innerHTML = `${pageHead('Dữ liệu & kỳ lương', 'Tải file Excel kỳ lương mới – không cần sửa mã nguồn')}
      <div class="note warn"><b>Bản demo:</b> file được đọc và xử lý ngay trong trình duyệt; dữ liệu chỉ nằm trong bộ nhớ của tab này (không ghi vào localStorage) và mất khi tải lại trang. Khi triển khai thật, file phải được tải lên máy chủ có xác thực.</div>
      <div class="grid g-21">
        ${card('Tải file Excel kỳ lương', `<div class="drop" id="drop"><p style="margin:0 0 10px">Kéo thả file <b>.xlsx</b> vào đây hoặc</p><input type="file" id="fileIn" accept=".xlsx" class="no-print"><p class="small muted" style="margin:10px 0 0">Cấu trúc cần có: sheet <b>Tổng hợp</b> (cột Mã nhân viên, Họ tên, Đơn vị, Tên vị trí, Nhóm lương + các cột tiền), <b>Chi tiết</b> (Mã HRM, Mã tb, ID tổng hợp, Tiền, ID loại tiền), <b>Loại tiền</b>.</p></div>
          <div class="formrow" style="margin-top:12px"><div class="field"><label>Kỳ lương (tháng/năm)</label><input class="input" type="month" id="perMonth"></div>
          <div class="field" style="flex:1;min-width:200px"><label>Nhãn kỳ (tùy chọn, VD: “Tạm tính lần 1”)</label><input class="input" id="perLabel"></div>
          <button class="btn primary" id="btnUp" disabled>${icon('upload')} Đọc & nạp dữ liệu</button></div>
          <div id="upMsg" class="small" style="margin-top:8px"></div>`)}
        ${card('Dữ liệu minh họa', `<p class="small">Nạp bộ dữ liệu <b>tự sinh, giả lập hoàn toàn</b> (tên “Người lao động minh họa…”, mã MH…, mã thuê bao MHTB…) để trình diễn popup chi tiết thuê bao, đối soát và xu hướng. Được gắn nhãn <b>DỮ LIỆU MINH HỌA</b> và tách thành kỳ riêng, không trộn với dữ liệu Excel.</p><button class="btn accent" id="btnDemo">Nạp dữ liệu minh họa</button>`)}
      </div>
      ${card('Các kỳ dữ liệu đã nạp', '<div id="perTb"></div>')}`;
    const fi = el.querySelector('#fileIn'), up = el.querySelector('#btnUp'), msg = el.querySelector('#upMsg'), drop = el.querySelector('#drop');
    let file = null;
    const pick = async f => {
      file = f; up.disabled = !f;
      if (!f) return;
      msg.innerHTML = `Đã chọn: <b>${U.esc(f.name)}</b> (${U.int(f.size / 1024)} KB) – <span class="spinner" style="width:14px;height:14px;border-width:2px"></span>đang đọc file…`;
      up.disabled = true;
      const hint = await Api.readPeriodHint(f);
      if (file !== f) return;
      up.disabled = false;
      msg.innerHTML = `Đã chọn: <b>${U.esc(f.name)}</b> (${U.int(f.size / 1024)} KB)`;
      if (hint) { el.querySelector('#perMonth').value = hint.code; msg.innerHTML += `<br>Gợi ý kỳ lương từ file: <b>${hint.code}</b> (${U.esc(hint.evidence)}) – kiểm tra lại trước khi nạp.`; }
      else msg.innerHTML += '<br><span class="faint">File không ghi kỳ lương → hãy chọn tháng/năm. Nếu bỏ trống, kỳ được ghi là “Chưa xác định kỳ”.</span>';
    };
    fi.onchange = () => pick(fi.files[0]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); };
    up.onclick = async () => {
      const mon = el.querySelector('#perMonth').value, lab = el.querySelector('#perLabel').value.trim();
      const base = mon ? `Tháng ${mon.slice(5)}/${mon.slice(0, 4)}` : `Chưa xác định kỳ (${new Date().toLocaleString('vi-VN')})`;
      up.disabled = true; msg.innerHTML = '<span class="spinner"></span>Đang đọc file…';
      try {
        const r = await Api.uploadExcel(file, { code: mon, label: lab ? `${base} – ${lab}` : base });
        await App.loadPeriods(r.id);
        toast(`Đã nạp ${r.employees} nhân sự, ${r.details} dòng chi tiết.`);
        App.go('overview');
      } catch (e) { msg.innerHTML = `<div class="note err" style="margin:0"><b>Không đọc được file:</b> ${U.esc(e.message)}</div>`; up.disabled = false; }
    };
    el.querySelector('#btnDemo').onclick = async () => { const r = await Api.loadDemo(); await App.loadPeriods(r.id); toast('Đã nạp dữ liệu minh họa.'); App.go('overview'); };
    new DataTable(el.querySelector('#perTb'), { rows: App.periods, search: false, columns: [
      { key: 'label', label: 'Kỳ lương', value: p => p.period.label, render: p => `${U.esc(p.period.label)} ${p.id === App.S.pid ? '<span class="badge info">Đang xem</span>' : ''}` },
      { key: 'source', label: 'Nguồn', render: p => p.source === 'demo' ? '<span class="badge kk">MINH HỌA</span>' : '<span class="badge ok">Excel</span>' },
      { key: 'fileName', label: 'File' }, { key: 'loadedAt', label: 'Thời điểm nạp', render: p => U.dt(p.loadedAt) },
      { key: 'act', label: '', sortable: false, render: p => `<button class="btn sm" data-view="${p.id}">Xem</button> <button class="btn sm danger" data-del="${p.id}">Xóa</button>` }],
      emptyText: 'Chưa có kỳ nào.',
      onRender: t => {
        t.el.querySelectorAll('[data-view]').forEach(b => b.onclick = async () => { await App.selectPeriod(b.dataset.view); App.go('overview'); });
        t.el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await Api.removeDataset(b.dataset.del); await App.loadPeriods(); App.renderFilters(); App.renderPage(); toast('Đã xóa kỳ dữ liệu khỏi bộ nhớ.'); });
      } });
  },

        <div class="checklist" style="margin-top:4px">${g.cols.map(k => { const c = Calc.col(m, k); return `<label><input type="checkbox" data-k="${k}" ${inc[k] ? 'checked' : ''}><span><span class="mono faint">${k}</span> ${U.esc(c.sub)} ${c.isKK ? '<span class="badge kk">KK</span>' : ''}</span></label>`; }).join('')}</div></div>`).join('') +
        `<div class="formrow"><button class="btn" id="fSave">Lưu thay đổi</button><button class="btn primary" id="fConfirm">${icon('check')} Xác nhận công thức</button>${m.formula.confirmed ? `<span class="small muted">Đã xác nhận: ${U.esc(m.formula.confirmed.by)} – ${U.dt(m.formula.confirmed.at)}</span>` : ''}</div>`)}
      <div style="height:14px"></div>
      ${card('Ánh xạ “ID tổng hợp” (sheet Chi tiết) → hạng mục (cột sheet Tổng hợp)', Q.idThValues.length ? `<p class="small muted" style="margin-top:0">${Q.sheets.idTongHop ? `Ánh xạ được đọc từ sheet “${U.esc(Q.sheets.idTongHop)}” của file – kiểm tra lại, có thể sửa và lưu.` : 'File không có bảng định nghĩa ID tổng hợp. Chỉ khai báo khi có căn cứ nghiệp vụ.'} ID chưa khai báo sẽ hiển thị “Chưa ánh xạ” và không được đối soát theo hạng mục.</p>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID tổng hợp</th><th>Số dòng</th><th>Hạng mục tương ứng</th></tr></thead><tbody>${Q.idThValues.map(id => `<tr><td class="mono">${U.esc(id || '(trống)')}</td><td class="num">${cnt[id] || 0}</td><td><select class="select" data-id="${U.esc(id)}"><option value="">— Chưa ánh xạ —</option>${Calc.leaves(m).map(c => `<option value="${c.key}" ${m.idMap[id] === c.key ? 'selected' : ''}>${c.key} · ${U.esc(c.label)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="formrow" style="margin-top:10px"><button class="btn primary" id="idSave">Lưu ánh xạ</button></div>`

    el.querySelectorAll('[data-k]').forEach(c => c.onchange = () => inc[c.dataset.k] = c.checked);

    el.querySelector('#fConfirm').onclick = async () => {

    };

          <li>Đọc 3 sheet Excel (.xlsx) trực tiếp trên trình duyệt, nhận diện hàng tiêu đề 2 cấp, loại dòng trống/dòng “Tổng”/bản ghi trùng; giữ mã HRM, mã thuê bao dạng chuỗi.</li>
          <li>Kiểm tra chất lượng dữ liệu, đối chiếu dòng “Tổng”, suy ra & kiểm tra công thức cột tổng từng nhóm, báo cáo đối soát.</li>
          <li>Đăng nhập mã HRM + mật khẩu, 3 cấp quyền, khóa sau 5 lần sai, tự đăng xuất sau 30 phút; mọi truy vấn dữ liệu đi qua lớp “máy chủ giả lập” lọc theo phạm vi quyền trước khi trả về giao diện.</li>
          <li>KPI, biểu đồ, so sánh đơn vị, Top 5, hồ sơ cá nhân, popup chi tiết từ mọi ô tiền, bộ lọc toàn cục, xuất CSV/Excel/In.</li></ul>
        <h3>Cần backend để triển khai thật (chưa triển khai thực tế)</h3><ul>
          <li>Xác thực tại máy chủ (SSO/LDAP nội bộ hoặc mật khẩu băm bcrypt/argon2), phiên HttpOnly cookie, MFA cho cấp 1–2. Không dùng mã HRM làm cơ chế xác thực duy nhất.</li>
          <li>Lưu dữ liệu lương trong CSDL máy chủ; API chỉ trả dữ liệu thuộc phạm vi quyền (cấp 2: theo đơn vị phân công; cấp 3: theo mã HRM của phiên đăng nhập), kiểm tra lại quyền ở MỌI yêu cầu đọc/xuất.</li>
          <li>Tải file Excel lên máy chủ (chỉ cấp 1), lưu lịch sử kỳ lương, nhật ký truy cập không sửa được, sao lưu, mã hóa khi lưu trữ, HTTPS.</li>
          <li>Đồng bộ danh mục tài khoản từ hệ thống nhân sự; luồng đổi/quên mật khẩu.</li></ul>
        <h3>Kiến trúc mã nguồn (trong <code>index.html</code>)</h3><ul>
          <li>Lớp 0 tiện ích, đọc/ghi Excel (<code>XlsxReader</code>, <code>XlsxWriter</code>) · Lớp 1 <code>PayrollParser</code> · Lớp 2 <code>DemoData</code> (tách biệt) · Lớp 3 <code>Calc</code></li>
          <li>Lớp 4 <code>MockServer</code> – thay bằng backend thật · Lớp 5 <code>Api</code> – nơi duy nhất cần đổi sang <code>fetch()</code> (danh sách endpoint gợi ý có trong mã nguồn)</li>
          <li>Lớp 6 biểu đồ & bảng · Lớp 7 <code>DetailModal</code> · Lớp 8 <code>Exporter</code> · Lớp 9 giao diện/trang.</li>
          <li>Không dùng thư viện ngoài, không cần Internet (font “Be Vietnam Pro” tải từ Google Fonts nếu có mạng, nếu không dùng font hệ thống).</li></ul>
        <h3>Hướng dẫn nhanh</h3><ol>
          <li>Mở <code>index.html</code> bằng Chrome/Edge/Firefox bản mới. Đăng nhập <code>QTDEMO</code> / <code>Demo@2026</code>.</li>
          <li>Vào “Dữ liệu & kỳ lương” → chọn file <code>.xlsx</code>, chọn tháng/năm kỳ lương → “Đọc & nạp dữ liệu”. Xem trang “Kiểm tra & đối soát” trước khi dùng số liệu.</li>
          <li>Vào “Cấu hình công thức” để kiểm tra các cột tính vào tổng thu nhập và bấm “Xác nhận công thức”; khai báo ánh xạ ID tổng hợp nếu sheet Chi tiết có dữ liệu.</li>
          <li>Vào “Tài khoản & phân quyền” để tạo tài khoản cấp 2 (chọn đơn vị phân công) và cấp 3; xuất danh sách tài khoản ra file để nhập lại lần sau.</li>
          <li>Kỳ lương mới: lặp lại bước 2 – mỗi file là một kỳ, chọn kỳ ở thanh bộ lọc.</li></ol>
      </div></div>`;
  },
};

/* =====================================================================
 * BÁO CÁO XUẤT FILE (dữ liệu luôn lấy qua Api → đã lọc theo quyền)
 * ===================================================================== */
const Reports = {
  async _scope() { return App.fetchScope(true); },
  leafHeader(m, keys) { return keys.map(k => `${k} · ${Calc.col(m, k).label}`); },
  async tonghop(fmt) {
    const m = App.meta, f = App.mf(), { emps } = await this._scope();
    const units = Calc.groupStats(m, emps, f, App.S.denom, e => e.unit);
    const doms = DOMAIN_ORDER.filter(d => m.columns.some(c => c.domain === d));
    const dom = Calc.domainBreakdown(m, emps, f), leaves = Calc.leafBreakdown(m, emps, f, true), tot = U.sum(dom, d => d.total);
    await Exporter.run('tonghop', fmt, 'TongHop', App.scopeSlug(), [
      { name: 'Theo đơn vị', title: 'BÁO CÁO TỔNG HỢP THU NHẬP THEO ĐƠN VỊ', extra: [['Bộ lọc', App.filterSummary(App.S.filters)], ['Mẫu số bình quân', App.S.denom === 'all' ? 'Toàn bộ nhân sự' : 'Nhân sự có phát sinh']],
        header: ['Đơn vị', 'Số NS', 'NS tính BQ', 'Tổng thu nhập', 'Khuyến khích', 'Bình quân', 'Trung vị', 'Cao nhất', 'Thấp nhất', ...doms.map(d => DOMAINS[d].short)],
        rows: units.map(g => [g.key, g.nAll, g.n, g.total, g.kk, g.avg, g.median, g.max, g.min, ...doms.map(d => g.dom[d])]) },
      { name: 'Theo mảng', title: 'TỔNG TIỀN THEO MẢNG DỊCH VỤ', header: ['Mảng', 'Lương', 'Khuyến khích', 'Tổng', 'Tỷ trọng', 'Số NS phát sinh'], rows: dom.map(d => [d.name, d.luong, d.kk, d.total, tot ? d.total / tot : null, d.nActive]) },
      { name: 'Theo hạng mục', title: 'TỔNG TIỀN THEO HẠNG MỤC', header: ['Cột', 'Mảng', 'Hạng mục', 'Tính chất', 'Trong công thức tổng', 'Tổng tiền', 'Số NS phát sinh'], rows: leaves.map(r => [r.col.key, DOMAINS[r.col.domain].short, r.col.label, r.col.isKK ? 'KK' : 'Lương', r.included ? 'Có' : 'Ngoài tổng', r.total, r.nActive]) },
    ]);
  },
  async donvi(fmt) {
    const m = App.meta, f = App.mf(), { emps, details } = await this._scope(), keys = Calc.measureCols(m, f);
    const subs = {}; Calc.detailRows(m, details, f).rows.forEach(d => (subs[d.hrm] || (subs[d.hrm] = new Set())).add(d.sub));
    await Exporter.run('donvi', fmt, 'TheoDonVi', App.scopeSlug(), [{ name: 'Nhân sự', title: 'BÁO CÁO THU NHẬP THEO ĐƠN VỊ – DANH SÁCH NHÂN SỰ', extra: [['Bộ lọc', App.filterSummary(App.S.filters)]],
      header: ['Mã HRM', 'Họ tên', 'Đơn vị', 'Chức danh', 'Nhóm lương', ...this.leafHeader(m, keys), 'Lương (không KK)', 'Khuyến khích', 'Tổng thu nhập', 'Số TB'],
      rows: emps.map(e => { const kk = Calc.val(e, keys.filter(k => Calc.col(m, k).isKK)), t = Calc.val(e, keys); return [e.hrm, e.name, e.unit, e.title, e.payGroup, ...keys.map(k => e.values[k]), t - kk, kk, t, m.detailTotal ? (subs[e.hrm]?.size || 0) : '']; }) }]);
  },
  async chucdanh(fmt) {
    const m = App.meta, f = App.mf(), { emps } = await this._scope();
    const byT = Calc.groupStats(m, emps, f, App.S.denom, e => e.title), byUT = Calc.groupStats(m, emps, f, App.S.denom, e => e.unit + '|' + e.title);
    await Exporter.run('chucdanh', fmt, 'TheoChucDanh', App.scopeSlug(), [
      { name: 'Theo chức danh', title: 'BÁO CÁO THU NHẬP THEO CHỨC DANH', header: ['Chức danh', 'Số NS', 'NS tính BQ', 'Tổng thu nhập', 'Khuyến khích', 'Bình quân', 'Trung vị', 'Cao nhất', 'Thấp nhất'], rows: byT.map(g => [g.key, g.nAll, g.n, g.total, g.kk, g.avg, g.median, g.max, g.min]) },
      { name: 'Đơn vị x chức danh', title: 'THU NHẬP THEO ĐƠN VỊ VÀ CHỨC DANH', header: ['Đơn vị', 'Chức danh', 'Số NS', 'NS tính BQ', 'Tổng thu nhập', 'Bình quân', 'Trung vị', 'Cao nhất', 'Thấp nhất'], rows: byUT.map(g => [...g.key.split('|'), g.nAll, g.n, g.total, g.avg, g.median, g.max, g.min]) },
    ]);
  },
  async top5dv(fmt) {
    const m = App.meta, f = App.mf(), { emps } = await this._scope();
    const g = Calc.groupStats(m, emps, f, App.S.denom, e => e.unit).filter(x => x.n > 0);
    const pN = U.sum(g, x => x.n), pooled = pN ? U.sum(g, x => x.total) / pN : null;
    const row = (x, i) => [i + 1, x.key, x.n, x.total, x.avg, x.median, x.avg - pooled, ...DOMAIN_ORDER.slice(0, 5).map(d => x.dom[d])];
    const header = ['Hạng', 'Đơn vị', 'Số NS tính', 'Tổng thu nhập', 'Bình quân', 'Trung vị', 'Chênh lệch so với BQ toàn phạm vi', ...DOMAIN_ORDER.slice(0, 5).map(d => DOMAINS[d].short)];
    await Exporter.run('top5dv', fmt, 'Top5DonVi', App.scopeSlug(), [
      { name: 'Cao nhất', title: 'TOP 5 ĐƠN VỊ THU NHẬP BÌNH QUÂN CAO NHẤT', extra: [['Bình quân toàn phạm vi', pooled]], header, rows: [...g].sort((a, b) => b.avg - a.avg).slice(0, 5).map(row) },
      { name: 'Thấp nhất', title: 'TOP 5 ĐƠN VỊ THU NHẬP BÌNH QUÂN THẤP NHẤT', extra: [['Bình quân toàn phạm vi', pooled]], header, rows: [...g].sort((a, b) => a.avg - b.avg).slice(0, 5).map(row) },
    ]);
  },
  async top5nv(fmt) {
    const m = App.meta, f = App.mf(), { emps } = await this._scope(), keys = Calc.measureCols(m, f);
    const rows = [];
    for (const t of U.uniq(emps.map(e => e.title)).sort()) {
      let list = emps.filter(e => e.title === t).map(e => ({ e, v: Calc.val(e, keys), kk: Calc.val(e, keys.filter(k => Calc.col(m, k).isKK)) }));
      if (App.S.denom === 'active') list = list.filter(x => Math.abs(x.v) >= .005);
      [...list].sort((a, b) => b.v - a.v).slice(0, 5).forEach((x, i) => rows.push([t, 'Cao nhất', i + 1, x.e.hrm, x.e.name, x.e.unit, x.v, x.v ? x.kk / x.v : null]));
      [...list].sort((a, b) => a.v - b.v).slice(0, 5).forEach((x, i) => rows.push([t, 'Thấp nhất', i + 1, x.e.hrm, x.e.name, x.e.unit, x.v, x.v ? x.kk / x.v : null]));
    }
    await Exporter.run('top5nv', fmt, 'Top5CaNhan', App.scopeSlug(), [{ name: 'Top 5 cá nhân', title: 'TOP 5 CÁ NHÂN THEO TỪNG CHỨC DANH', header: ['Chức danh', 'Danh sách', 'Hạng', 'Mã HRM', 'Họ tên', 'Đơn vị', 'Tổng thu nhập', 'Tỷ trọng KK'], rows }]);
  },
  async bangke(fmt, hrm) {
    if (!hrm) { toast('Hãy chọn một người lao động ở trang Hồ sơ trước.', true); return; }
    const m = App.meta;
    let list, details;
    try { [list, details] = await Promise.all([Api.employees(App.S.pid, { hrm }), Api.details(App.S.pid, { hrm })]); } catch (e) { toast(e.message, true); return; }
    const e = list[0]; if (!e) { toast('Không có dữ liệu.', true); return; }
    const keys = Calc.measureCols(m, {});
    await Exporter.run('bangke', fmt, 'BangKeCaNhan', 'NV-' + hrm, [
      { name: 'Bảng kê', title: 'BẢNG KÊ THU NHẬP CÁ NHÂN', extra: [['Mã HRM', e.hrm], ['Họ tên', e.name], ['Đơn vị', e.unit], ['Chức danh', e.title], ['Nhóm lương', e.payGroup], ['Tổng thu nhập', Calc.val(e, keys)]],
        header: ['Mảng', 'Hạng mục', 'Tính chất', 'Số tiền'], rows: Calc.leaves(m).map(c => [DOMAINS[c.domain].short, c.label, c.isKK ? 'KK' : 'Lương', e.values[c.key]]) },
      { name: 'Chi tiết thuê bao', title: 'CHI TIẾT MÃ THUÊ BAO', extra: m.detailTotal ? [] : [['Ghi chú', 'Sheet Chi tiết của kỳ này không có dữ liệu']], header: ['STT', 'Mã thuê bao', 'Loại tiền', 'Hạng mục', 'Số tiền'], rows: details.map((d, i) => [i + 1, d.sub, d.typeName || 'Chưa ánh xạ', d.col ? Calc.col(m, d.col).label : 'Chưa ánh xạ', d.amount]) },
    ], { hrm });
  },
  async chitiet(fmt) {
    const m = App.meta, f = App.mf(), { emps, details } = await this._scope(), nm = Object.fromEntries(emps.map(e => [e.hrm, e]));
    const rows = Calc.detailRows(m, details, f).rows;
    await Exporter.run('chitiet', fmt, 'ChiTietThueBao', App.scopeSlug(), [{ name: 'Chi tiết', title: 'BẢNG CHI TIẾT MÃ THUÊ BAO VÀ LOẠI TIỀN', extra: m.detailTotal ? [['Bộ lọc', App.filterSummary(App.S.filters)]] : [['Ghi chú', 'Sheet Chi tiết của kỳ này không có dòng dữ liệu']],
      header: ['STT', 'Mã HRM', 'Họ tên', 'Đơn vị', 'Mã thuê bao', 'ID tổng hợp', 'ID loại tiền', 'Loại tiền', 'Cột', 'Hạng mục', 'Số tiền'],
      rows: rows.map((d, i) => [i + 1, d.hrm, nm[d.hrm]?.name, nm[d.hrm]?.unit, d.sub, d.idTH, d.typeId, d.typeName || 'Chưa ánh xạ', d.col || '', d.col ? Calc.col(m, d.col).label : 'Chưa ánh xạ', d.amount]) }]);
  },
  async doisoat(fmt) {
    let Q; try { Q = await Api.quality(App.S.pid); } catch (e) { toast(e.message, true); return; }
    const emps = await Api.employees(App.S.pid, {});
    await Exporter.run('doisoat', fmt, 'DoiSoatDuLieu', 'ToanVT', [
      { name: 'Phát hiện', title: 'BÁO CÁO KIỂM TRA ĐỐI SOÁT DỮ LIỆU', extra: [['File', Q.fileName], ['Số NS hợp lệ', Q.nEmployees], ['Dòng lỗi/bị loại', Q.errorRows.length], ['Dòng chi tiết', Q.detailTotal]], header: ['Mức', 'Mã', 'Nội dung'], rows: Q.issues.map(i => [i.level, i.code, i.msg]) },
      { name: 'Công thức nhóm', title: 'KIỂM TRA CỘT TỔNG TỪNG NHÓM', header: ['Nhóm', 'Cột tổng', 'Cột thành phần', 'Kết quả', 'Cột ngoài tổng', 'Số dòng lệch (nếu cộng mọi cột)'], rows: Q.groups.map(g => [g.name, g.totalCol || '', g.cols.join(', '), g.check.status, (g.check.excluded || []).join(', '), g.check.badRows ?? '']) },
      { name: 'Cột & dòng Tổng', title: 'ĐỐI CHIẾU DÒNG “TỔNG” CỦA FILE', header: ['Cột', 'Nhóm', 'Hạng mục', 'Trong công thức', 'Σ dòng nhân viên', 'Dòng Tổng file', 'Chênh lệch'], rows: Q.columns.map(c => { const d = Q.totalRow?.diffs.find(x => x.key === c.key); return [c.key, c.group, c.sub, c.isTotal ? 'Cột tổng' : Q.formula.included[c.key] ? 'Có' : 'Ngoài tổng', U.sum(emps, e => e.values[c.key]), d?.fileV ?? '', d?.diff ?? '']; }) },
      { name: 'Dòng lỗi', title: 'DÒNG LỖI / BỊ LOẠI', header: ['Sheet', 'Dòng', 'Mã HRM', 'Lý do'], rows: [...Q.errorRows.map(r => [r.sheet, r.row, r.hrm || '', r.reason]), ...Q.orphanDetails.map(d => [Q.sheets.chiTiet, d.row, d.hrm, 'Mã HRM không có trong Tổng hợp'])] },
    ]);
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>
